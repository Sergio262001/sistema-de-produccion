<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img"
     aria-label="Espacio reservado para la fotografía de portada">
  <!-- ══════════════════════════════════════════════════════════
       ESPACIO RESERVADO — NO SE PUBLICA.
       Dibujo propio, no una foto de banco. Busca leerse como una
       visualización arquitectónica en proceso: volumen, luz y
       profundidad, para que el espacio se entienda antes de que
       llegue la fotografía real de INCOARQI.
       ══════════════════════════════════════════════════════════ -->
  <defs>
    <linearGradient id="aire" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#22406F"/>
      <stop offset=".55" stop-color="#16294D"/>
      <stop offset="1" stop-color="#0C1730"/>
    </linearGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="1" y2=".6">
      <stop offset="0" stop-color="#C9A227" stop-opacity=".32"/>
      <stop offset=".45" stop-color="#C9A227" stop-opacity=".06"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#8FB4E8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8FB4E8" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="caraA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8EDF6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#E8EDF6" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="caraB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050A16" stop-opacity="0"/>
      <stop offset="1" stop-color="#050A16" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050A16" stop-opacity=".55"/>
      <stop offset="1" stop-color="#050A16" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#aire)"/>
  <rect width="1600" height="900" fill="url(#luz)"/>

  <!-- Retícula de plano, al fondo -->
  <g stroke="#C9A227" stroke-width="1" opacity=".08">
    <path d="M0 150H1600M0 300H1600M0 450H1600M0 600H1600M0 750H1600"/>
    <path d="M150 0V900M300 0V900M450 0V900M600 0V900M750 0V900M900 0V900M1050 0V900M1200 0V900M1350 0V900M1500 0V900"/>
  </g>

  <!-- Torres de fondo: la profundidad la da el contraste, no el detalle -->
  <g opacity=".22">
    <rect x="1150" y="230" width="170" height="670" fill="#9FB6D8"/>
    <rect x="1345" y="330" width="120" height="570" fill="#8AA3C8"/>
  </g>
  <g opacity=".34">
    <rect x="930" y="360" width="190" height="540" fill="#B6C8E2"/>
  </g>

  <!-- Volumen principal, en tres caras: es lo que lee como render -->
  <g>
    <!-- cara iluminada -->
    <path d="M300 860V455l280-160v565z" fill="url(#caraA)"/>
    <!-- cara en sombra -->
    <path d="M580 295l280 160v405H580z" fill="url(#caraB)"/>
    <!-- cubierta -->
    <path d="M300 455l280-160 280 160-280 92z" fill="#E8EDF6" opacity=".16"/>
    <!-- aristas -->
    <g stroke="#C9A227" stroke-width="2" fill="none" opacity=".75">
      <path d="M300 860V455l280-160 280 160v405"/>
      <path d="M300 455l280 92 280-92"/><path d="M580 547v313"/>
    </g>
    <!-- ventanales -->
    <g fill="url(#vidrio)">
      <rect x="340" y="530" width="90" height="120"/>
      <rect x="450" y="570" width="90" height="120"/>
      <rect x="640" y="560" width="80" height="110"/>
      <rect x="750" y="600" width="80" height="110"/>
      <rect x="340" y="700" width="90" height="120"/>
      <rect x="640" y="710" width="190" height="150"/>
    </g>
  </g>

  <!-- Grúa: el signo de "en obra", y da escala vertical -->
  <g stroke="#C9A227" stroke-width="2.5" fill="none" opacity=".55">
    <path d="M1060 900V150"/><path d="M900 195h330"/>
    <path d="M1060 150l-160 45M1060 150l170 45"/>
    <path d="M985 195v80"/><path d="M963 275h44v38h-44z"/>
  </g>

  <!-- Suelo: ancla la composición -->
  <rect x="0" y="820" width="1600" height="80" fill="url(#suelo)"/>
  <path d="M0 860h1600" stroke="#C9A227" stroke-width="2" opacity=".35"/>

  <text x="80" y="112" font-family="ui-monospace,monospace" font-size="20"
        fill="#C9A227" letter-spacing="5" opacity=".8">ESPACIO RESERVADO</text>
  <text x="80" y="146" font-family="ui-monospace,monospace" font-size="14"
        fill="#C9D3E8" letter-spacing="2" opacity=".5">AQUI VA LA FOTOGRAFIA DE INCOARQI</text>
</svg>
