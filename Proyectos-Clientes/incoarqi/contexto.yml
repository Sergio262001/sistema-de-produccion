# ════════════════════════════════════════════════════════════
#  INCOARQI S.A.S. — landing page corporativa
#  EL PRIMER CLIENTE REAL DEL SISTEMA.
#
#  Cotización 001-2026 · 8 sep 2026 · $300.000 COP neto
#  Entrega: 5 a 7 días hábiles desde la recepción del material.
#
#  El contenido de abajo está TRANSCRITO del brochure corporativo que
#  entregó el cliente. No hay una palabra inventada. Lo que no venía en
#  el brochure está marcado POR DEFINIR y hay que pedirlo — ver el
#  README del proyecto.
# ════════════════════════════════════════════════════════════

cliente:  "INCOARQI S.A.S."
proyecto: "INCOARQI S.A.S."
base:     landing-modular
linea:    starter

marca:
  # Tomados del brochure: azul marino profundo + dorado.
  # Los neutros NO son azules: si el suelo y la tinta fueran del matiz del
  # acento, el dorado no tendría contra qué destacar (ver la skill
  # direccion-de-arte → "los neutros se eligen, no se heredan").
  primario:   "#16294D"      # azul marino del logo y los bloques
  secundario: "#F7F7F5"      # suelo casi neutro, un pelo cálido
  acento:     "#C9A227"      # dorado: el ÚNICO color saturado de la página
  direccion:  taller         # ficha técnica: ingeniería, no boutique
  inicial:    "I"
  logo:       ""             # POR DEFINIR — pedir el logo en SVG o PNG transparente
  banner:     ""             # POR DEFINIR — la foto de portada del brochure
  subtitulo:  "Ingeniería · Construcción · Arquitectura · Innovación"
  tono:       "técnico, sobrio y confiable"

pagina:
  hero:
    # PORTADA OSCURA — pendiente de confirmar con el cliente.
    # Queda en "oscuro" porque es la recomendación del estudio: su brochure
    # es azul marino con fotografía grande, y la versión clara —aunque
    # correcta— no se siente de INCOARQI.
    # Si prefieren la clara, se cambia esta línea a "claro" y se regenera.
    fondo:   "oscuro"
    # La foto de portada va aquí cuando la manden. Sin ella se ve el azul
    # plano a sangre, que sigue siendo mejor que un hueco gris.
    foto:    ""                # POR DEFINIR
    eyebrow: "Ingeniería · Construcción · Arquitectura · Innovación"
    titular: "Diseñamos, planeamos, construimos y transformamos"
    bajada:  "Soluciones integrales para convertir ideas en proyectos de alto valor."
    cta:     "Hablemos de tu proyecto"

  servicios_titulo: "Nuestros servicios"
  servicios:
    - titulo: "Ingeniería"
      icono:  "regla"
      desc:   "Ingeniería civil, eléctrica e hidrosanitaria. Diseño estructural y de instalaciones. Presupuestos, APU y cantidades de obra. Análisis, diagnóstico y soluciones técnicas."
    - titulo: "Arquitectura y diseño"
      icono:  "plano"
      desc:   "Diseño arquitectónico y de interiores. Modelado 3D y renders. Planos arquitectónicos y técnicos. Coordinación arquitectura - ingeniería."
    - titulo: "Construcción"
      icono:  "grua"
      desc:   "Obra nueva y obra gris. Acabados arquitectónicos. Construcciones residenciales, comerciales e institucionales. Urbanismo y espacio público."
    - titulo: "Gerencia y gestión de proyectos"
      icono:  "equipo"
      desc:   "Gerencia, dirección y residencia de obra. Supervisión técnica y administrativa. Control de costos, tiempo y calidad. Informes, actas y seguimiento."
    - titulo: "Presupuestos y control de costos"
      icono:  "calculadora"
      desc:   "Presupuestos de obra. Análisis de precios unitarios (APU). Control presupuestal. Seguimiento y proyección de costos."
    - titulo: "Planeación y programación"
      icono:  "calendario"
      desc:   "Programación de obra. Cronogramas y curvas de avance. Control de rendimientos. Reprogramaciones y seguimiento."

  diferencial_titulo: "Nuestro diferencial"
  diferencial:
    - titulo: "Integración"
      icono:  "red"
      texto:  "Integramos ingeniería, arquitectura, construcción y gestión en una misma visión."
    - titulo: "Planeación"
      icono:  "lupa"
      texto:  "Analizamos antes de construir para tomar mejores decisiones."
    - titulo: "Control"
      icono:  "lista"
      texto:  "Seguimos y controlamos cada etapa del proyecto."
    - titulo: "Calidad"
      icono:  "escudo"
      texto:  "Cumplimos estándares técnicos y normativos."
    - titulo: "Innovación"
      icono:  "idea"
      texto:  "Utilizamos tecnología y metodologías que optimizan procesos."
    - titulo: "Compromiso"
      icono:  "mano"
      texto:  "Trabajamos de la mano con nuestros clientes con transparencia y responsabilidad."

  # Los 8 pasos van numerados porque SON una secuencia: el orden es
  # información que el cliente necesita entender.
  proceso_titulo: "Nuestro proceso"
  proceso:
    - { titulo: "Conocer",      texto: "Entendemos tu necesidad." }
    - { titulo: "Analizar",     texto: "Evaluamos condiciones y alternativas." }
    - { titulo: "Diseñar",      texto: "Desarrollamos la solución." }
    - { titulo: "Presupuestar", texto: "Calculamos costos y recursos." }
    - { titulo: "Planear",      texto: "Definimos estrategia y programación." }
    - { titulo: "Construir",    texto: "Ejecutamos con calidad y seguridad." }
    - { titulo: "Controlar",    texto: "Monitoreamos avances y calidad." }
    - { titulo: "Entregar",     texto: "Verificamos y entregamos." }

  galeria_titulo: "Proyectos"
  galeria: []                  # POR DEFINIR — las fotos las manda el cliente

  sectores_titulo: "Sectores"
  sectores:
    - { nombre: "Vivienda",               icono: "casa" }
    - { nombre: "Comercial",              icono: "tienda" }
    - { nombre: "Institucional",          icono: "edificio" }
    - { nombre: "Oficinas",               icono: "edificio" }
    - { nombre: "Urbanismo",              icono: "arbol" }
    - { nombre: "Industria",              icono: "fabrica" }
    - { nombre: "Remodelaciones",         icono: "llave" }
    - { nombre: "Adecuaciones locativas", icono: "regla" }
    - { nombre: "Mantenimiento",          icono: "engranaje" }
    - { nombre: "Obras civiles",          icono: "puente" }

  # LOS BLOQUES DE COLOR.
  # El brochure de INCOARQI no es una hoja blanca: alterna azul marino y
  # blanco, con diagonales doradas entre medio. Sin esa alternancia, siete
  # secciones seguidas sobre el mismo fondo se leen como un documento, no
  # como una página. Estas dos van sobre el azul de marca.
  secciones_oscuras:
    - "diferencial"
    - "proceso"
    - "pie"

  # TUTEO, no "usted". Lo señaló el auditor: el brochure del cliente dice
  # "Entendemos TU necesidad", y yo había puesto "su proyecto" en el botón.
  # Mezclar las dos personas en la misma página hace que INCOARQI parezca
  # inconsistente. Manda la voz del cliente, no mi preferencia.
  leads_titulo: "Hablemos de tu proyecto"

  sobre:
    titulo: "Por qué INCOARQI"
    texto:  "Integramos conocimiento, experiencia e innovación para garantizar proyectos exitosos."

  ubicacion:
    direccion: "POR DEFINIR"   # el brochure solo dice "Colombia"
  redes:
    instagram: ""              # POR DEFINIR

base_de_datos:
  motor: local                 # una landing no necesita base de datos

apis:
  mensajeria:  whatsapp
  # El brochure trae 300 123 4567, que es un número de relleno.
  # NO se publica hasta que el cliente confirme el real.
  whatsapp_num: "POR DEFINIR"
  pagos:       ninguna
  analitica:   ga4             # incluido en la cotización
  # El ID de medición de GA4. NO es un secreto (viaja en el HTML de todo
  # sitio que use GA4), así que va aquí y no en el .env. Vacío = no se
  # carga nada, ni una petición de red.
  ga4_id:      ""              # POR DEFINIR
  correo:      "info@incoarqi.com"

entrega:
  dominio:  "incoarqi.com"     # recomendado en la cotización, sin comprar aún
  soporte:  ninguno            # el plan de mantenimiento se cotizó aparte
  estado:   "en construccion"
  creado:   "2026-09-12"

env:
  - GA4_ID                     # POR DEFINIR
