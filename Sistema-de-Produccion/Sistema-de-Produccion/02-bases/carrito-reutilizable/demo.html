<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base: Carrito Reutilizable · Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Karla:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#1F6B4A;--bg:#F3ECE0;--surface:#fff;--ink:#23201A;--ink-soft:#6B6359;
    --line:#E4DACA;--accent:#C2703D;--radius:16px;--sys-bg:#0C1322;--sys:#2F54FF;
    --display:'Fraunces',serif;--body:'Inter',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;

    /* Valores por defecto = dirección "taller" (ver el bloque de abajo) */
    --borde:1px;--sombra:0 6px 20px rgba(35,32,26,.08);
    --peso-titulo:600;--tracking:-.01em;--ritmo:1;
    --foto-alto:150px;--foto-prop:auto;
    --precio-familia:var(--display);--precio-peso:600;--precio-tam:16px;
    --boton-radio:9px;--boton-mayus:none;
  }

  /* ══════════════════════════════════════════════════════════════
     DIRECCIONES DE ARTE
     Cambiar el color no cambia el diseño: dos clientes con paletas
     distintas recibían la misma vitrina pintada de otro color. La
     dirección cambia tipografía, escala, forma y ritmo.
     Se elige en la ficha:  marca.direccion: mercado | boutique | taller
     ══════════════════════════════════════════════════════════════ */

  /* MERCADO — denso, alto contraste, el precio manda. */
  [data-dir="mercado"]{
    --display:'Archivo',system-ui,sans-serif;--body:'Archivo',system-ui,sans-serif;
    --radius:3px;--borde:2px;--sombra:4px 4px 0 var(--ink);
    --peso-titulo:800;--tracking:-.03em;--ritmo:.85;
    --precio-familia:var(--display);--precio-peso:800;--precio-tam:20px;
    --boton-radio:3px;--boton-mayus:uppercase;
  }
  [data-dir="mercado"] .card{border-color:var(--ink);}
  [data-dir="mercado"] .logo{border-radius:4px;}

  /* BOUTIQUE — aire, editorial, sin ruido. */
  [data-dir="boutique"]{
    --display:'Fraunces',Georgia,serif;--body:'Karla',system-ui,sans-serif;
    --radius:0px;--borde:0px;--sombra:none;
    --peso-titulo:600;--tracking:-.005em;--ritmo:1.4;
    --foto-alto:auto;--foto-prop:3/4;
    --precio-familia:var(--body);--precio-peso:500;--precio-tam:14.5px;
    --boton-radio:0px;
  }
  [data-dir="boutique"] .card{background:transparent;}
  [data-dir="boutique"] .card .ph{border-bottom:0;}
  [data-dir="boutique"] .logo{border-radius:0;}
  [data-dir="boutique"] .banner{border-radius:0;}

  /* TALLER — ficha técnica, funcional. */
  [data-dir="taller"]{--precio-familia:var(--mono);--precio-peso:500;}

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;
     font-weight:var(--peso-titulo);letter-spacing:var(--tracking);}
  button{font-family:inherit;cursor:pointer;}

  .sysbar{background:var(--sys-bg);color:#C9D2EA;font-family:'JetBrains Mono',monospace;font-size:12.5px;}
  .sysbar .in{max-width:1000px;margin:0 auto;padding:11px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .sysbar .tag{background:#1B2438;border:1px solid #2A3654;border-radius:6px;padding:3px 9px;color:#9BB0E0;}
  .sysbar b{color:#fff;}
  .toggle{display:flex;background:#1B2438;border:1px solid #2A3654;border-radius:8px;overflow:hidden;}
  .toggle button{background:transparent;border:0;color:#9BB0E0;font-family:'JetBrains Mono',monospace;font-size:12px;padding:6px 13px;}
  .toggle button.on{background:var(--brand);color:#fff;}
  .sysbar .pay{margin-left:auto;color:#8E9AB8;}
  .sysbar .pay b{color:#5FD0A6;}

  .app{max-width:1000px;margin:0 auto;padding:0 20px;}
  .head{display:flex;align-items:center;gap:14px;padding:28px 0 6px;}
  .logo{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;}
  .head h1{font-size:26px;}
  .head .cartbtn{margin-left:auto;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:11px 18px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:9px;color:var(--ink);}
  .head .cartbtn .badge{background:var(--brand);color:#fff;border-radius:20px;min-width:20px;height:20px;font-size:11px;display:grid;place-items:center;padding:0 5px;font-family:'JetBrains Mono';}

  /* ---- BLOQUES DE PÁGINA ----
     Hero, sobre el negocio, horarios, dónde estamos y pie. Todos nacen
     ocultos: si la ficha no los trae, no dejan hueco. `hidden` y
     `.en-admin` ganan siempre. */
  .hero{padding:calc(10px * var(--ritmo)) 0 calc(26px * var(--ritmo));
     max-width:58ch;}
  .hero h2{font-size:clamp(24px,4.2vw,36px);line-height:1.1;}
  .hero p{margin:12px 0 0;color:var(--ink-soft);font-size:16px;line-height:1.55;}

  .bloques{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
     gap:calc(20px * var(--ritmo));padding:calc(26px * var(--ritmo)) 0;
     border-top:var(--borde) solid var(--line);}
  .bloque h2{font-size:15px;font-family:var(--body);font-weight:600;
     text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);
     margin-bottom:10px;}
  .bloque p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink);}
  .bloque .lista{list-style:none;margin:0;padding:0;font-size:14.5px;
     line-height:1.9;color:var(--ink);}
  .enlace{display:inline-block;margin-top:10px;color:var(--brand);
     font-size:13.5px;font-weight:600;text-decoration:none;
     border-bottom:1px solid currentColor;}
  .enlace:hover{opacity:.75;}

  .pie{border-top:var(--borde) solid var(--line);padding:22px 0 90px;}
  .pie-in{display:flex;flex-wrap:wrap;gap:16px;align-items:center;
     font-size:13.5px;color:var(--ink-soft);}
  .pie-in b{font-family:var(--display);font-size:15px;color:var(--ink);}
  .pie .enlace{margin-top:0;}

  .hero[hidden],.bloques[hidden],.pie[hidden]{display:none;}
  .hero.en-admin,.bloques.en-admin,.pie.en-admin{display:none;}

  /* La dirección de arte también manda aquí, o el hero sería el mismo
     rectángulo de texto para los tres mundos visuales. */
  [data-dir="mercado"] .hero h2{text-transform:uppercase;}
  [data-dir="mercado"] .bloque h2{border-bottom:2px solid var(--ink);
     padding-bottom:6px;color:var(--ink);}
  [data-dir="boutique"] .hero{max-width:44ch;padding-bottom:40px;}
  [data-dir="boutique"] .hero h2{font-size:clamp(28px,5vw,44px);}
  [data-dir="boutique"] .bloque h2{text-transform:none;letter-spacing:0;
     font-family:var(--display);font-size:19px;color:var(--ink);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
     gap:calc(16px * var(--ritmo));padding:24px 0 60px;}
  .card{background:var(--surface);border:var(--borde) solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sombra);}
  /* La foto es lo que vende. Alto fijo para que la rejilla no salte
     mientras cargan, y object-fit para que ninguna salga deformada. */
  .card .ph{width:100%;height:var(--foto-alto);aspect-ratio:var(--foto-prop);
     object-fit:cover;display:block;
     background:var(--bg);border-bottom:1px solid var(--line);}
  .card .ph.sinfoto{display:grid;place-items:center;font-size:46px;
     background:linear-gradient(135deg,#fff,var(--line));}
  /* Banner del cliente: ancho completo, alto acotado, recorte centrado.
     `hidden` gana siempre — sin banner no debe quedar un hueco gris. */
  .banner{display:block;width:100%;max-height:240px;object-fit:cover;
     border-radius:14px;margin:24px 0 0;background:var(--bg);}
  .banner[hidden]{display:none;}
  /* Con logo real el cuadro de color estorba: se vuelve marco transparente. */
  .logo.conimg{background:none;box-shadow:none;overflow:hidden;}
  .logo img{width:100%;height:100%;object-fit:contain;display:block;}
  .card .b{padding:14px 15px 15px;display:flex;flex-direction:column;flex:1;}
  .card h3{font-size:16px;font-family:var(--body);font-weight:600;}
  .card .d{font-size:12.5px;color:var(--ink-soft);margin:3px 0 12px;line-height:1.4;flex:1;}
  .card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .card .pr{font-family:var(--precio-familia);font-weight:var(--precio-peso);
     font-size:var(--precio-tam);color:var(--brand);}
  .add{background:var(--brand);color:#fff;border:0;border-radius:var(--boton-radio);
     padding:9px 14px;font-weight:600;font-size:13px;
     text-transform:var(--boton-mayus);letter-spacing:.02em;}
  .add:active{transform:scale(.96);}

  /* drawer */
  .overlay{position:fixed;inset:0;background:rgba(20,16,10,.4);opacity:0;pointer-events:none;transition:.25s;z-index:30;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:380px;max-width:90vw;background:var(--bg);z-index:40;transform:translateX(100%);transition:.28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.3);}
  .drawer.show{transform:none;}
  .drawer .dh{padding:22px 22px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
  .drawer .dh h2{font-size:21px;}
  .drawer .close{background:none;border:0;font-size:24px;color:var(--ink-soft);line-height:1;}
  .lines{flex:1;overflow-y:auto;padding:8px 22px;}
  .empty{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:14px;}
  .line{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);align-items:center;}
  .line .em{width:46px;height:46px;border-radius:10px;background:var(--surface);border:1px solid var(--line);object-fit:cover;display:block;flex:none;}
  .line .em.sinfoto{display:grid;place-items:center;font-size:22px;}
  .line .li{flex:1;min-width:0;}
  .line .nm{font-weight:600;font-size:14px;}
  .line .lp{font-size:12.5px;color:var(--ink-soft);}
  .qty{display:flex;align-items:center;gap:8px;}
  .qty button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:15px;color:var(--ink);display:grid;place-items:center;}
  .qty span{font-family:'JetBrains Mono';font-size:13px;min-width:16px;text-align:center;}
  .foot{padding:18px 22px 22px;border-top:1px solid var(--line);background:var(--surface);}
  .totrow{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);margin-bottom:7px;}
  .totrow.big{font-size:18px;color:var(--ink);font-weight:600;margin:12px 0 16px;font-family:var(--display);}
  .pay-btn{width:100%;border:0;border-radius:12px;padding:15px;font-weight:600;font-size:15px;color:#fff;background:var(--brand);display:flex;align-items:center;justify-content:center;gap:9px;}
  .pay-btn.wa{background:#25D366;}
  .pay-btn svg{width:18px;height:18px;}
  .paynote{font-family:'JetBrains Mono';font-size:11px;color:var(--ink-soft);text-align:center;margin-top:10px;}
  @media(prefers-reduced-motion:reduce){.drawer,.overlay{transition:none;}}
</style>
</head>
<body>

<div class="sysbar"><div class="in">
  <span class="tag">base: carrito-reutilizable</span>
  <span>contexto: <b id="sysClient">Café Raíz</b></span>
  <span class="tag">dirección</span>
  <div class="toggle dirsw">
    <button type="button" data-d="mercado">Mercado</button>
    <button type="button" data-d="boutique">Boutique</button>
    <button type="button" data-d="taller">Taller</button>
  </div>
  <span class="tag">marca</span>
  <div class="toggle marcasw">
    <button type="button" class="on" onclick="verMarca(false)">Inicial</button>
    <button type="button" onclick="verMarca(true)">Logo y banner</button>
  </div>
  <span class="pay">checkout: <b id="sysPay">whatsapp</b></span>
</div></div>

<div class="app">
  <!-- Banner del cliente. Nace oculto: si no hay imagen no deja hueco. -->
  <img class="banner" id="banner" alt="" hidden>

  <div class="head">
    <div class="logo" id="logo">R</div>
    <h1 id="biz">Café Raíz</h1>
    <button type="button" class="cartbtn" onclick="openCart()">
      🛒 Carrito <span class="badge" id="count">0</span>
    </button>
  </div>
  <!-- HERO. Nace oculto: sin titular no se muestra. -->
  <section class="hero" id="hero" hidden></section>

  <div class="grid" id="grid"></div>

  <!-- BLOQUES DE PÁGINA. Cada uno se pinta SOLO si la ficha lo trae. -->
  <section class="bloques" id="bloques" hidden></section>

  <!-- PIE. Contacto, horarios y dirección. Oculto si no hay nada que decir. -->
  <footer class="pie" id="pie" hidden></footer>
</div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<aside class="drawer" id="drawer" aria-label="Carrito">
  <div class="dh"><h2>Tu pedido</h2><button type="button" class="close" onclick="closeCart()" aria-label="Cerrar">×</button></div>
  <div class="lines" id="lines"></div>
  <div class="foot" id="foot"></div>
</aside>

<script>
/* ── Motor de carrito (idéntico a src/core/cart.js, en línea para la demo) ── */
function createCart(opts={}){
  const config={moneda:opts.moneda||'$',envio:opts.envio||0,impuesto:opts.impuesto||0,maxPorItem:opts.maxPorItem||99};
  let items=[]; const listeners=new Set();
  function compute(){
    const count=items.reduce((n,i)=>n+i.qty,0);
    const subtotal=items.reduce((n,i)=>n+i.precio*i.qty,0);
    const impuesto=Math.round(subtotal*(config.impuesto/100));
    const envio=items.length?config.envio:0;
    return {items:[...items],count,subtotal,impuesto,envio,total:subtotal+impuesto+envio,config};
  }
  function emit(){const s=compute();listeners.forEach(fn=>fn(s));}
  function add(p,qty=1){const e=items.find(i=>i.id===p.id);if(e){e.qty=Math.min(e.qty+qty,config.maxPorItem);}else{items.push({...p,qty:Math.min(qty,config.maxPorItem)});}emit();}
  function setQty(id,qty){const it=items.find(i=>i.id===id);if(!it)return;it.qty=Math.max(0,Math.min(qty,config.maxPorItem));if(it.qty===0)remove(id);else emit();}
  function increment(id){const it=items.find(i=>i.id===id);if(it)setQty(id,it.qty+1);}
  function decrement(id){const it=items.find(i=>i.id===id);if(it)setQty(id,it.qty-1);}
  function remove(id){items=items.filter(i=>i.id!==id);emit();}
  function clear(){items=[];emit();}
  function subscribe(fn){listeners.add(fn);fn(compute());return()=>listeners.delete(fn);}
  return {add,remove,setQty,increment,decrement,clear,subscribe,get:compute};
}
function money(n,moneda='$'){return moneda+(n||0).toLocaleString('es-CO');}

/* ---- SEGURIDAD (ver 03-componentes-ui/seguridad.js) ----
   Todo dato escrito por alguien que no seas tú pasa por esc()
   antes de tocar innerHTML. Sin esto, un nombre como
   <img src=x onerror=...> se ejecuta en la sesión de quien lo vea. */
function esc(v){
  if(v===null||v===undefined) return '';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* Solo http(s) y rutas del propio sitio. Bloquea javascript: y data:,
   que en un src pueden ejecutar código en la sesión de quien mire. */
function urlSegura(v){
  const s=String(v||'').trim();
  if(!s) return '';
  if(/^https?:\/\//i.test(s) || s.startsWith('/') || s.startsWith('./')) return s;
  return '';
}
/* Foto del producto, con el emoji como respaldo. Se vende con fotos:
   un emoji no vende un plato ni una chaqueta. El alt lleva el nombre
   real — es lo que se lee si la foto no carga. */
function medio(p, clase='ph'){
  const src=urlSegura(p.imagen);
  return src
    ? `<img class="${clase}" src="${esc(src)}" alt="${esc(p.nombre||'')}" loading="lazy" decoding="async">`
    : `<div class="${clase} sinfoto" role="img" aria-label="${esc(p.nombre||'')}">${esc(p.emoji||'🛍️')}</div>`;
}
/* ---- LOGO Y BANNER DEL CLIENTE ----
   Aguantan que el elemento no exista: borrar un id del marcado y que el
   script muera con él ya dejó una entrega en blanco. */
function pintarLogo(el, m, cliente){
  if(!el) return;
  const src = urlSegura(m && m.logo);
  el.textContent = '';
  if(src){
    const img = document.createElement('img');
    img.src = src; img.alt = cliente || ''; img.decoding = 'async';
    el.appendChild(img);
    el.classList.add('conimg');
  } else {
    el.classList.remove('conimg');
    el.textContent = (m && m.inicial) || '';
  }
}
function pintarBanner(el, m, cliente){
  if(!el) return;
  const src = urlSegura(m && m.banner);
  if(!src){ el.hidden = true; el.removeAttribute('src'); return; }
  el.src = src; el.alt = cliente || '';
  el.loading = 'lazy'; el.decoding = 'async';
  el.hidden = false;
}


/* ── Checkout (idéntico a src/core/checkout.js) ── */
function resumenTexto(state,cliente,ctx){
  const lineas=state.items.map(i=>`• ${i.qty}× ${esc(i.nombre)} — ${money(i.precio*i.qty,state.config.moneda)}`).join('\n');
  return [`Hola ${ctx.cliente}, quiero hacer un pedido 🙌`,'',lineas,'',`Total: ${money(state.total,state.config.moneda)}`].join('\n');
}
function checkout(state,cliente,ctx){
  const metodo=ctx.apis?.pagos||'whatsapp';
  if(metodo==='whatsapp'){
    const num=ctx.apis?.whatsapp_num||'';
    return {tipo:'redirect',url:`https://wa.me/${num}?text=${encodeURIComponent(resumenTexto(state,cliente,ctx))}`};
  }
  if(metodo==='wompi'){
    return {tipo:'widget',proveedor:'wompi'};
  }
  return {tipo:'pago',proveedor:metodo,monto:state.total,nota:'Crear preferencia/sesión en tu backend con las claves del .env, luego redirigir al cliente a la URL que devuelva el proveedor.'};
}

/* ── Conector Wompi (idéntico a src/core/wompi.adapter.js) ──
   Widget oficial de Wompi: funciona en sandbox solo con la public key.
   Producción exige firma de integridad calculada en tu backend — ver
   el comentario completo en wompi.adapter.js. Aquí, si no hay
   public_key configurada, se explica en vez de fallar en silencio. */
let wompiWidgetReady=null;
function cargarWidgetWompi(){
  if(window.WidgetCheckout) return Promise.resolve();
  if(wompiWidgetReady) return wompiWidgetReady;
  wompiWidgetReady=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://checkout.wompi.co/widget.js';
    s.onload=resolve; s.onerror=()=>reject(new Error('No se pudo cargar el widget de Wompi'));
    document.head.appendChild(s);
  });
  return wompiWidgetReady;
}
async function abrirWompi(state,ctx){
  await cargarWidgetWompi();
  const checkout=new window.WidgetCheckout({
    currency:'COP',
    amountInCents:Math.round(state.total*100),
    reference:`${ctx.cliente||'pedido'}-${Date.now()}`,
    publicKey:ctx.apis.wompi_public_key,
    redirectUrl:window.location.href,
  });
  checkout.open(result=>console.log('Resultado Wompi:',result));
}

/* CONTEXTO — vendría de la ficha del proyecto */
const CONTEXT = {
  cliente: "Café Raíz",
  marca:{ primario:"#1F6B4A", secundario:"#F3ECE0", inicial:"R",
          direccion:"boutique",   // mercado | boutique | taller — ver el CSS
          // Logo y banner del cliente. Vacíos = inicial en un cuadro y sin
          // banner. Un negocio que ya tiene logo no se entrega con una letra.
          logo:"", banner:"" },
  apis:{ pagos:"whatsapp", whatsapp_num:"573001234567", wompi_public_key:"" },  // prueba: cambia pagos a "wompi" y pon tu public key sandbox
  /* LOS BLOQUES DE LA PÁGINA. Cada uno se pinta SOLO si trae contenido.
     Vacío = no existe; nunca se rellena con texto de ejemplo. */
  pagina:{
    hero:{ titular:"Desayunos y café para llevar",
           bajada:"Pide desde aquí y recoge en 15 minutos." },
    sobre:{ titulo:"Sobre nosotros",
            texto:"Cocina abierta desde 2019. Pan de masa madre propio y "
                + "café de fincas de Nariño, tostado cada semana." },
    horarios:["Lunes a viernes · 7:00 a 20:00","Sábados · 8:00 a 21:00"],
    ubicacion:{ direccion:"Carrera 35 #8A-12, Provenza · Medellín" },
    redes:{ instagram:"caferaiz.co" }
  },
  moneda:"$"
};

/* CATÁLOGO de ejemplo (en real viene de la base de datos).
   Va por categorías y se llama `DATA` a propósito: es la forma que el
   generador sabe reemplazar con el catálogo real del cliente. Cuando esto
   era un array plano llamado PRODUCTOS, el generador no lo encontraba y
   la tienda del cliente se entregaba con el menú del café de ejemplo. */
let DATA = {
  categorias: [
    { id:'cafe', nombre:'Café', desc:'Tostado propio', productos:[
      { id:'c2', nombre:'Latte de la casa', desc:'Leche texturizada, arte latte', precio:8500, emoji:'🥛' },
      { id:'c3', nombre:'Cold brew', desc:'Extracción en frío 18h', precio:9000, emoji:'🧊' },
    ]},
    { id:'cocina', nombre:'Cocina', desc:'Todo el día', productos:[
      { id:'b1', nombre:'Huevos benedictinos', desc:'Pan de masa madre', precio:18500, emoji:'🍳' },
      { id:'b2', nombre:'Avo toast', desc:'Aguacate, tomate, sésamo', precio:15000, emoji:'🥑' },
    ]},
    { id:'postres', nombre:'Postres', desc:'Hechos en casa', productos:[
      { id:'p1', nombre:'Cheesecake', desc:'Frutos del bosque', precio:11000, emoji:'🍰' },
      { id:'p2', nombre:'Brownie', desc:'Chocolate 70%, nuez', precio:9500, emoji:'🍫' },
    ]},
  ],
};
/* La vitrina es plana: una sola rejilla con todo. Las categorías existen
   para que el catálogo del cliente encaje, no para partir la pantalla. */
const PRODUCTOS = DATA.categorias.flatMap(c => c.productos || []);

/* tema desde contexto */
const r=document.documentElement.style;
r.setProperty('--brand',CONTEXT.marca.primario);
r.setProperty('--bg',CONTEXT.marca.secundario);
/* ====================================================================
   BLOQUES DE PÁGINA — lo que convierte un catálogo en un sitio.

   Regla única y no negociable: un bloque sin contenido NO se pinta.
   Ni con texto de ejemplo, ni con un "Próximamente", ni con una foto de
   banco. Un hueco honesto se ve mejor que un relleno inventado, y además
   le dice al dueño qué le falta mandar.
   ==================================================================== */
function pintarPagina(){
  const p = (CONTEXT.pagina) || {};

  // ── Hero ──
  const hero = document.getElementById('hero');
  if(hero){
    const t = String(p.hero && p.hero.titular || '').trim();
    const b = String(p.hero && p.hero.bajada || '').trim();
    if(t || b){
      hero.innerHTML = (t ? '<h2>'+esc(t)+'</h2>' : '')
                     + (b ? '<p>'+esc(b)+'</p>' : '');
      hero.hidden = false;
    } else { hero.hidden = true; }
  }

  // ── Sobre el negocio · horarios · dónde estamos ──
  const zona = document.getElementById('bloques');
  if(zona){
    const partes = [];

    const texto = String(p.sobre && p.sobre.texto || '').trim();
    if(texto){
      const titulo = String(p.sobre.titulo || 'Sobre nosotros').trim();
      partes.push('<div class="bloque"><h2>'+esc(titulo)+'</h2>'
        + '<p>'+esc(texto)+'</p></div>');
    }

    const horarios = Array.isArray(p.horarios) ? p.horarios.filter(Boolean) : [];
    if(horarios.length){
      partes.push('<div class="bloque"><h2>Horarios</h2><ul class="lista">'
        + horarios.map((h)=>'<li>'+esc(h)+'</li>').join('')
        + '</ul></div>');
    }

    const dir = String(p.ubicacion && p.ubicacion.direccion || '').trim();
    if(dir){
      // El enlace al mapa se arma con la dirección; no hace falta API ni clave.
      const mapa = 'https://www.google.com/maps/search/?api=1&query='
        + encodeURIComponent(dir);
      partes.push('<div class="bloque"><h2>Dónde estamos</h2><p>'+esc(dir)+'</p>'
        + '<a class="enlace" href="'+esc(mapa)+'" target="_blank" rel="noopener">'
        + 'Ver en el mapa</a></div>');
    }

    zona.innerHTML = partes.join('');
    zona.hidden = partes.length === 0;
  }

  // ── Pie ──
  const pie = document.getElementById('pie');
  if(pie){
    const trozos = [];
    const wa = String(CONTEXT.apis && CONTEXT.apis.whatsapp_num || '').replace(/\D/g,'');
    if(wa) trozos.push('<a class="enlace" href="https://wa.me/'+esc(wa)
      + '" target="_blank" rel="noopener">WhatsApp</a>');
    const ig = String(p.redes && p.redes.instagram || '').replace(/^@/,'').trim();
    if(ig) trozos.push('<a class="enlace" href="https://instagram.com/'+esc(ig)
      + '" target="_blank" rel="noopener">@'+esc(ig)+'</a>');
    const dir = String(p.ubicacion && p.ubicacion.direccion || '').trim();
    if(dir) trozos.push('<span>'+esc(dir)+'</span>');

    if(trozos.length){
      pie.innerHTML = '<div class="pie-in"><b>'+esc(CONTEXT.cliente)+'</b>'
        + trozos.join('') + '</div>';
      pie.hidden = false;
    } else { pie.hidden = true; }
  }
}

/** Las tres direcciones válidas. Cualquier otra cosa cae en "taller". */
const DIRECCIONES = ['mercado', 'boutique', 'taller'];

function pintarMarca(){
  const m = CONTEXT.marca;
  // La dirección de arte cambia tipografía, escala, forma y ritmo — no solo
  // color. Ver el bloque DIRECCIONES DE ARTE en el CSS.
  const dir = DIRECCIONES.includes(m.direccion) ? m.direccion : 'taller';
  document.documentElement.setAttribute('data-dir', dir);
  pintarLogo(document.getElementById('logo'),m,CONTEXT.cliente);
  pintarBanner(document.getElementById('banner'),m,CONTEXT.cliente);
  pintarPagina();
}
pintarMarca();
/* @demo-only
   Conmutador de la sysbar: enseña en vivo la diferencia entre entregar
   con la inicial y entregar con el logo del cliente. Los marcadores de
   arriba y abajo se los lleva crear-proyecto.js: al cliente no le llega
   ni esta función ni los SVG de ejemplo. */
function verMarca(con){
  CONTEXT.marca.logo   = con ? './logo-demo.svg'   : '';
  CONTEXT.marca.banner = con ? './banner-demo.svg' : '';
  pintarMarca();
  const sw = document.querySelector('.marcasw');
  if(sw) sw.querySelectorAll('button').forEach((b,n)=>
    b.classList.toggle('on', n === (con ? 1 : 0)));
}
(function cablearDirecciones(){
  const sw = document.querySelector('.dirsw');
  if(!sw) return;
  const marcar = (d) => sw.querySelectorAll('button').forEach((b) =>
    b.classList.toggle('on', b.dataset.d === d));
  sw.querySelectorAll('button').forEach((b) => {
    b.onclick = () => { CONTEXT.marca.direccion = b.dataset.d; pintarMarca(); marcar(b.dataset.d); };
  });
  marcar(document.documentElement.getAttribute('data-dir'));
})();
/* @fin-demo */
document.getElementById('biz').textContent=CONTEXT.cliente;
document.getElementById('sysClient').textContent=CONTEXT.cliente;
document.getElementById('sysPay').textContent=CONTEXT.apis.pagos;

/* crea el carrito */
const cart = createCart({ moneda:CONTEXT.moneda, envio:0 });
const M = CONTEXT.moneda;

/* pinta catálogo */
const grid=document.getElementById('grid');
PRODUCTOS.forEach(p=>{
  const el=document.createElement('div'); el.className='card';
  el.innerHTML=`${medio(p)}<div class="b">
    <h3>${esc(p.nombre)}</h3><div class="d">${esc(p.desc)}</div>
    <div class="row"><span class="pr">${money(p.precio,M)}</span>
    <button type="button" class="add">Agregar</button></div></div>`;
  el.querySelector('.add').onclick=()=>{ cart.add(p,1); pulse(); };
  grid.appendChild(el);
});

/* la UI se redibuja sola al cambiar el carrito (patrón reactivo) */
cart.subscribe(state=>{
  document.getElementById('count').textContent=state.count;
  renderLines(state);
  renderFoot(state);
});

function renderLines(state){
  const c=document.getElementById('lines');
  if(!state.items.length){ c.innerHTML='<div class="empty">Tu carrito está vacío.<br>Agrega algo del menú 🙂</div>'; return; }
  c.innerHTML='';
  state.items.forEach(i=>{
    const row=document.createElement('div'); row.className='line';
    row.innerHTML=`${medio(i,'em')}
      <div class="li"><div class="nm">${esc(i.nombre)}</div><div class="lp">${money(i.precio,M)} c/u</div></div>
      <div class="qty"><button type="button" aria-label="menos">−</button><span>${i.qty}</span><button type="button" aria-label="más">+</button></div>`;
    const [minus,,plus]=row.querySelectorAll('.qty *');
    minus.onclick=()=>cart.decrement(i.id);
    plus.onclick=()=>cart.increment(i.id);
    c.appendChild(row);
  });
}

function renderFoot(state){
  const f=document.getElementById('foot');
  if(!state.items.length){ f.innerHTML=''; return; }
  const wa = CONTEXT.apis.pagos==='whatsapp';
  f.innerHTML=`
    <div class="totrow"><span>Subtotal</span><span>${money(state.subtotal,M)}</span></div>
    ${state.envio?`<div class="totrow"><span>Envío</span><span>${money(state.envio,M)}</span></div>`:''}
    <div class="totrow big"><span>Total</span><span>${money(state.total,M)}</span></div>
    <button type="button" class="pay-btn ${wa?'wa':''}" id="payBtn">
      ${wa?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.2-1.7-.8-2-.9-.3-.1-.5-.2-.6.2-.2.3-.7.8-.8 1-.2.2-.3.2-.6.1-1.5-.8-2.6-1.4-3.6-3.2-.3-.5.3-.5.8-1.5.1-.2 0-.3 0-.5 0-.1-.6-1.5-.8-2.1-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-1 1-1 2.4-.1 3.9 1.3 2 2.3 3.1 4.4 4 1.3.5 1.8.6 2.5.5.4-.1 1.3-.5 1.5-1 .2-.5.2-1 .1-1.1z"/></svg>Pedir por WhatsApp':'Pagar con '+CONTEXT.apis.pagos}
    </button>
    <div class="paynote">checkout activo: ${CONTEXT.apis.pagos}</div>`;
  document.getElementById('payBtn').onclick=()=>doCheckout(state);
}

function doCheckout(state){
  const res = checkout(state, {}, CONTEXT);
  if(res.tipo==='redirect') window.open(res.url,'_blank');
  else if(res.tipo==='widget' && res.proveedor==='wompi'){
    if(!CONTEXT.apis.wompi_public_key){
      alert('Para probar el widget real de Wompi: crea una cuenta sandbox en wompi.co, copia tu "public key" de pruebas en CONTEXT.apis.wompi_public_key (dentro de este archivo) y vuelve a intentar.');
      return;
    }
    abrirWompi(state, CONTEXT);
  }
  else if(res.tipo==='pago') alert(`→ Iría a ${res.proveedor}\nMonto: ${money(res.monto,M)}\n(${res.nota})`);
}

/* helpers de UI */
function openCart(){ document.getElementById('drawer').classList.add('show'); document.getElementById('overlay').classList.add('show'); }
function closeCart(){ document.getElementById('drawer').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); }
function pulse(){ const b=document.getElementById('count'); b.animate([{transform:'scale(1)'},{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:250}); }
window.openCart=openCart; window.closeCart=closeCart;
</script>
