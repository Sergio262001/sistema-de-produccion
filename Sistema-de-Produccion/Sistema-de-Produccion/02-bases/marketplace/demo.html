<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base: Marketplace · Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#6A3CF0;--bg:#F5F7FB;--accent:#E8A02C;--surface:#fff;--ink:#0F1626;
    --ink-soft:#454F66;--line:#E2E7F0;--danger:#E5484D;--good:#0FA56C;--radius:14px;
    --display:'Space Grotesk',sans-serif;--body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--display);margin:0;}
  button{font-family:inherit;cursor:pointer;}

  .sysbar{background:#0C1322;color:#C9D2EA;font-family:monospace;font-size:12.5px;}
  .sysbar .in{max-width:1000px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .sysbar .tag{background:#1B2438;border:1px solid #2A3654;border-radius:6px;padding:3px 9px;color:#9BB0E0;}
  .sysbar b{color:#fff;}
  .sysbar .warn{margin-left:auto;color:#E8B86A;}

  .app{max-width:1000px;margin:0 auto;padding:0 20px;}
  .head{display:flex;align-items:center;gap:14px;padding:28px 0 6px;}
  .head h1{font-size:24px;}
  .cartbtn{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:11px 18px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:9px;color:var(--ink);}
  .cartbtn .badge{background:var(--brand);color:#fff;border-radius:20px;min-width:20px;height:20px;font-size:11px;display:grid;place-items:center;padding:0 5px;font-family:monospace;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;padding:18px 0 50px;}
  .product{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;}
  .product.agotado{opacity:.55;}
  .product .ph{height:100px;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,#fff,var(--line));}
  .product .b{padding:13px 14px 14px;display:flex;flex-direction:column;flex:1;}
  .product h3{font-size:15px;margin:0 0 3px;}
  .product .vendor{font-family:monospace;font-size:10.5px;color:var(--brand);margin-bottom:6px;}
  .product .d{font-size:12px;color:var(--ink-soft);margin:0 0 10px;line-height:1.4;flex:1;}
  .product .row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .product .pr{font-family:var(--display);font-weight:600;font-size:16px;color:var(--brand);}
  .add{background:var(--brand);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-weight:600;font-size:12.5px;}
  .add:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;}

  .overlay{position:fixed;inset:0;background:rgba(15,22,38,.4);opacity:0;pointer-events:none;transition:.25s;z-index:30;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:400px;max-width:92vw;background:var(--bg);z-index:40;transform:translateX(100%);transition:.28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.3);}
  .drawer.show{transform:none;}
  .drawer .dh{padding:22px 22px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
  .drawer .close{background:none;border:0;font-size:24px;color:var(--ink-soft);line-height:1;}
  .lines{flex:1;overflow-y:auto;padding:8px 22px;}
  .empty{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:14px;}
  .vgroup{margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .vgroup .vname{font-family:monospace;font-size:11px;color:var(--brand);font-weight:600;margin-bottom:8px;}
  .line{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13px;}
  .line:last-of-type{border-bottom:none;}
  .line .nm{flex:1;}
  .vfoot{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .foot{padding:18px 22px 22px;border-top:1px solid var(--line);background:var(--surface);}
  .totrow{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .totrow.big{font-size:17px;color:var(--ink);font-weight:600;margin:10px 0 14px;font-family:var(--display);}
  .pay-btn{width:100%;border:0;border-radius:11px;padding:14px;font-weight:600;font-size:14.5px;color:#fff;background:var(--brand);}
</style>
</head>
<body>

<div class="sysbar"><div class="in">
  <span class="tag">base: marketplace</span>
  <span>contexto: <b id="sysClient">Mercado Hecho a Mano</b></span>
  <span class="warn">split de pago automático no incluido — liquidación manual (ver README)</span>
</div></div>

<div class="app">
  <div class="head">
    <h1 id="biz">Mercado Hecho a Mano</h1>
    <button type="button" class="cartbtn" onclick="openCart()">🛒 Carrito <span class="badge" id="count">0</span></button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><h2>Tu pedido</h2><button type="button" class="close" onclick="closeCart()" aria-label="Cerrar">×</button></div>
  <div class="lines" id="lines"></div>
  <div class="foot" id="foot"></div>
</aside>

<script>
/* ── CONTEXTO ── */
const CONTEXT = {
  cliente: "Mercado Hecho a Mano",
  base_de_datos: { motor: "local" },
  apis: { pagos: "whatsapp", whatsapp_num: "573001112222" },
  comisionPorcentaje: 12,   // % que se queda la plataforma — ajusta según el contexto del proyecto
  moneda: "$",
};

/* ── DATOS (idéntico a src/data/local.adapter.js) ── */
let DATA = {
  vendedores: [
    { id:'v1', nombre:'Taller Norte', contacto:'573001112222' },
    { id:'v2', nombre:'Estudio Sur', contacto:'573003334444' },
  ],
  productos: [
    { id:'p1', vendedorId:'v1', nombre:'Maceta de barro', desc:'Hecha a mano, 20cm', precio:35000, emoji:'🪴', stock:10 },
    { id:'p2', vendedorId:'v1', nombre:'Cojín tejido', desc:'Algodón, 40x40', precio:58000, emoji:'🛋️', stock:6 },
    { id:'p3', vendedorId:'v2', nombre:'Lámpara de mesa', desc:'Madera y lino', precio:92000, emoji:'💡', stock:4 },
    { id:'p4', vendedorId:'v2', nombre:'Cuadro decorativo', desc:'Impresión en lienzo', precio:75000, emoji:'🖼️', stock:0 },
  ],
};

/* ── MOTOR DE CARRITO (idéntico a src/core/cart.js) ── */
function createCart(opts={}){
  const config={moneda:opts.moneda||'$',maxPorItem:opts.maxPorItem||99};
  let items=[]; const listeners=new Set();
  function compute(){
    const count=items.reduce((n,i)=>n+i.qty,0);
    const subtotal=items.reduce((n,i)=>n+i.precio*i.qty,0);
    return {items:[...items],count,subtotal,total:subtotal,config};
  }
  function emit(){const s=compute();listeners.forEach(fn=>fn(s));}
  function add(p,qty=1){const e=items.find(i=>i.id===p.id);if(e){e.qty=Math.min(e.qty+qty,config.maxPorItem);}else{items.push({...p,qty:Math.min(qty,config.maxPorItem)});}emit();}
  function increment(id){const it=items.find(i=>i.id===id);if(it){it.qty++;emit();}}
  function decrement(id){const it=items.find(i=>i.id===id);if(!it)return;it.qty--;if(it.qty<=0)items=items.filter(i=>i.id!==id);emit();}
  function subscribe(fn){listeners.add(fn);fn(compute());return ()=>listeners.delete(fn);}
  return {add,increment,decrement,subscribe,get:compute};
}
function money(n){ return CONTEXT.moneda+(n||0).toLocaleString('es-CO'); }

/* ---- SEGURIDAD (ver 03-componentes-ui/seguridad.js) ----
   Todo dato escrito por alguien que no seas tú pasa por esc()
   antes de tocar innerHTML. Sin esto, un nombre como
   <img src=x onerror=...> se ejecuta en la sesión del admin. */
function esc(v){
  if(v===null||v===undefined) return "";
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}


/* ── CHECKOUT MULTI-VENDEDOR (idéntico a src/core/checkout.js) ── */
function desglosePorVendedor(state){
  const porVendedor={};
  state.items.forEach(item=>{
    const vId=item.vendedorId;
    if(!porVendedor[vId]) porVendedor[vId]={vendedorId:vId,items:[],subtotal:0};
    porVendedor[vId].items.push(item);
    porVendedor[vId].subtotal += item.precio*item.qty;
  });
  return Object.values(porVendedor).map(g=>{
    const vendedor=DATA.vendedores.find(v=>v.id===g.vendedorId);
    const comision=Math.round(g.subtotal*(CONTEXT.comisionPorcentaje/100));
    return {vendedor:vendedor||{nombre:'Desconocido'}, items:g.items, subtotal:g.subtotal, comision, neto:g.subtotal-comision};
  });
}
function resumenTexto(state){
  const desglose=desglosePorVendedor(state);
  const lineas=desglose.map(g=>`${esc(g.vendedor.nombre)}: ${money(g.subtotal)} (neto: ${money(g.neto)})`).join('\n');
  return [`Hola, quiero hacer un pedido 🙌`,'',lineas,'',`Total: ${money(state.total)}`].join('\n');
}

const cart = createCart({ moneda: CONTEXT.moneda });

/* ── CATÁLOGO ── */
function renderCatalogo(){
  const grid=document.getElementById('grid'); grid.innerHTML='';
  DATA.productos.forEach(p=>{
    const vendedor = DATA.vendedores.find(v=>v.id===p.vendedorId);
    const agotado = p.stock<=0;
    const el=document.createElement('div'); el.className='product'+(agotado?' agotado':'');
    el.innerHTML=`<div class="ph">${esc(p.emoji||'🛍️')}</div><div class="b">
      <h3>${esc(p.nombre)}</h3>
      <div class="vendor">vendido por ${esc(vendedor?.nombre||'—')}</div>
      <div class="d">${esc(p.desc||'')}</div>
      <div class="row"><span class="pr">${money(p.precio)}</span>
      <button type="button" class="add" ${agotado?'disabled':''}>${agotado?'Agotado':'Agregar'}</button></div>
    </div>`;
    if(!agotado) el.querySelector('.add').onclick=()=>{ cart.add(p,1); pulse(); };
    grid.appendChild(el);
  });
}

cart.subscribe(state=>{
  document.getElementById('count').textContent=state.count;
  renderLines(state); renderFoot(state);
});

function renderLines(state){
  const c=document.getElementById('lines');
  if(!state.items.length){ c.innerHTML='<div class="empty">Tu carrito está vacío.</div>'; return; }
  const desglose=desglosePorVendedor(state);
  c.innerHTML = desglose.map(g=>`
    <div class="vgroup">
      <div class="vname">${esc(g.vendedor.nombre)}</div>
      ${g.items.map(i=>`<div class="line"><span class="nm">${i.qty}× ${esc(i.nombre)}</span><span>${money(i.precio*i.qty)}</span></div>`).join('')}
      <div class="vfoot"><span>Comisión plataforma (${CONTEXT.comisionPorcentaje}%)</span><span>${money(g.comision)}</span></div>
      <div class="vfoot"><span>Neto para el vendedor</span><span>${money(g.neto)}</span></div>
    </div>`).join('');
}
function renderFoot(state){
  const f=document.getElementById('foot');
  if(!state.items.length){ f.innerHTML=''; return; }
  f.innerHTML=`
    <div class="totrow big"><span>Total</span><span>${money(state.total)}</span></div>
    <button type="button" class="pay-btn" id="payBtn">Pedir por WhatsApp</button>`;
  document.getElementById('payBtn').onclick=()=>{
    const num=CONTEXT.apis.whatsapp_num;
    window.open(`https://wa.me/${num}?text=${encodeURIComponent(resumenTexto(state))}`,'_blank');
  };
}

function openCart(){ document.getElementById('drawer').classList.add('show'); document.getElementById('overlay').classList.add('show'); }
function closeCart(){ document.getElementById('drawer').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); }
function pulse(){ const b=document.getElementById('count'); b.animate([{transform:'scale(1)'},{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:250}); }
window.openCart=openCart; window.closeCart=closeCart;

document.getElementById('biz').textContent = CONTEXT.cliente;
document.getElementById('sysClient').textContent = CONTEXT.cliente;
renderCatalogo();
</script>
</body>
</html>
