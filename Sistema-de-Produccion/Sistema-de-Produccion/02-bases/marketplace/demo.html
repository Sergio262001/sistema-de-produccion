<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base: Marketplace · Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#6A3CF0;--bg:#F5F7FB;--accent:#E8A02C;--surface:#fff;--ink:#0F1626;
    --ink-soft:#454F66;--line:#E2E7F0;--danger:#E5484D;--good:#0FA56C;--radius:14px;
    --display:'Space Grotesk',sans-serif;--body:'Inter',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;

    /* Valores por defecto = dirección "taller" (ver el bloque de abajo) */
    --borde:1px;--sombra:none;--peso-titulo:600;--tracking:-.01em;--ritmo:1;
    --foto-alto:150px;--foto-prop:auto;
    --precio-familia:var(--display);--precio-peso:600;--precio-tam:16px;
    --boton-radio:9px;--boton-mayus:none;
  }

  /* ══════════════════════════════════════════════════════════════
     DIRECCIONES DE ARTE
     Un marketplace de artesanías y uno de repuestos no se ven igual.
     La dirección cambia tipografía, escala, forma y ritmo — no color.
     Se elige en la ficha:  marca.direccion: mercado | boutique | taller
     ══════════════════════════════════════════════════════════════ */

  /* MERCADO — denso, alto contraste, el precio manda. */
  [data-dir="mercado"]{
    --display:'Archivo',system-ui,sans-serif;--body:'Archivo',system-ui,sans-serif;
    --radius:3px;--borde:2px;--sombra:4px 4px 0 var(--ink);
    --peso-titulo:800;--tracking:-.03em;--ritmo:.85;
    --precio-familia:var(--display);--precio-peso:800;--precio-tam:20px;
    --boton-radio:3px;--boton-mayus:uppercase;
  }
  [data-dir="mercado"] .product{border-color:var(--ink);}
  [data-dir="mercado"] .logo{border-radius:4px;}

  /* BOUTIQUE — aire, editorial: artesanía, diseño, piezas únicas. */
  [data-dir="boutique"]{
    --display:'Fraunces',Georgia,serif;--body:'Karla',system-ui,sans-serif;
    --radius:0px;--borde:0px;--sombra:none;
    --peso-titulo:600;--tracking:-.005em;--ritmo:1.4;
    --foto-alto:auto;--foto-prop:3/4;
    --precio-familia:var(--body);--precio-peso:500;--precio-tam:14.5px;
    --boton-radio:0px;
  }
  [data-dir="boutique"] .product{background:transparent;}
  [data-dir="boutique"] .product .ph{border-bottom:0;}
  [data-dir="boutique"] .logo{border-radius:0;}
  [data-dir="boutique"] .banner{border-radius:0;}

  /* TALLER — ficha técnica: repuestos, insumos, B2B. */
  [data-dir="taller"]{--precio-familia:var(--mono);--precio-peso:500;}

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--display);margin:0;
     font-weight:var(--peso-titulo);letter-spacing:var(--tracking);}
  button{font-family:inherit;cursor:pointer;}

  .sysbar{background:#0C1322;color:#C9D2EA;font-family:monospace;font-size:12.5px;}
  .sysbar .in{max-width:1000px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .sysbar .tag{background:#1B2438;border:1px solid #2A3654;border-radius:6px;padding:3px 9px;color:#9BB0E0;}
  .sysbar b{color:#fff;}
  .sysbar .warn{margin-left:auto;color:#E8B86A;}

  .app{max-width:1000px;margin:0 auto;padding:0 20px;}
  .head{display:flex;align-items:center;gap:14px;padding:28px 0 6px;}
  .logo{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;flex:none;}
  /* Con logo real el cuadro de color estorba: se vuelve marco transparente. */
  .logo.conimg{background:none;box-shadow:none;overflow:hidden;}
  .logo img{width:100%;height:100%;object-fit:contain;display:block;}
  /* Banner de la plataforma: ancho completo, alto acotado, recorte centrado.
     `hidden` gana siempre — sin banner no debe quedar un hueco gris. */
  .banner{display:block;width:100%;max-height:240px;object-fit:cover;
     border-radius:14px;margin:24px 0 0;background:var(--bg);}
  .banner[hidden]{display:none;}
  .toggle{display:flex;background:#1B2438;border:1px solid #2A3654;border-radius:8px;overflow:hidden;}
  .toggle button{background:transparent;border:0;color:#9BB0E0;font-family:monospace;font-size:12px;padding:6px 13px;}
  .toggle button.on{background:var(--brand);color:#fff;}
  .head h1{font-size:24px;}
  .cartbtn{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:11px 18px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:9px;color:var(--ink);}
  .cartbtn .badge{background:var(--brand);color:#fff;border-radius:20px;min-width:20px;height:20px;font-size:11px;display:grid;place-items:center;padding:0 5px;font-family:monospace;}

  /* ---- BLOQUES DE PÁGINA ----
     Hero, sobre el negocio, horarios, dónde estamos y pie. Todos nacen
     ocultos: si la ficha no los trae, no dejan hueco. `hidden` y
     `.en-admin` ganan siempre. */
  .hero{padding:calc(10px * var(--ritmo)) 0 calc(26px * var(--ritmo));
     max-width:58ch;}
  .hero h2{font-size:clamp(24px,4.2vw,36px);line-height:1.1;}
  .hero p{margin:12px 0 0;color:var(--ink-soft);font-size:16px;line-height:1.55;}

  .bloques{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
     gap:calc(20px * var(--ritmo));padding:calc(26px * var(--ritmo)) 0;
     border-top:var(--borde) solid var(--line);}
  .bloque h2{font-size:15px;font-family:var(--body);font-weight:600;
     text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);
     margin-bottom:10px;}
  .bloque p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink);}
  .bloque .lista{list-style:none;margin:0;padding:0;font-size:14.5px;
     line-height:1.9;color:var(--ink);}
  .enlace{display:inline-block;margin-top:10px;color:var(--brand);
     font-size:13.5px;font-weight:600;text-decoration:none;
     border-bottom:1px solid currentColor;}
  .enlace:hover{opacity:.75;}

  .pie{border-top:var(--borde) solid var(--line);padding:22px 0 90px;}
  .pie-in{display:flex;flex-wrap:wrap;gap:16px;align-items:center;
     font-size:13.5px;color:var(--ink-soft);}
  .pie-in b{font-family:var(--display);font-size:15px;color:var(--ink);}
  .pie .enlace{margin-top:0;}

  .hero[hidden],.bloques[hidden],.pie[hidden]{display:none;}
  .hero.en-admin,.bloques.en-admin,.pie.en-admin{display:none;}

  /* La dirección de arte también manda aquí, o el hero sería el mismo
     rectángulo de texto para los tres mundos visuales. */
  [data-dir="mercado"] .hero h2{text-transform:uppercase;}
  [data-dir="mercado"] .bloque h2{border-bottom:2px solid var(--ink);
     padding-bottom:6px;color:var(--ink);}
  [data-dir="boutique"] .hero{max-width:44ch;padding-bottom:40px;}
  [data-dir="boutique"] .hero h2{font-size:clamp(28px,5vw,44px);}
  [data-dir="boutique"] .bloque h2{text-transform:none;letter-spacing:0;
     font-family:var(--display);font-size:19px;color:var(--ink);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
     gap:calc(16px * var(--ritmo));padding:18px 0 50px;}
  .product{background:var(--surface);border:var(--borde) solid var(--line);
     border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;
     box-shadow:var(--sombra);}
  .product.agotado{opacity:.55;}
  /* La foto es lo que vende. Alto fijo para que la rejilla no salte
     mientras cargan, y object-fit para que ninguna salga deformada. */
  .product .ph{width:100%;height:var(--foto-alto);aspect-ratio:var(--foto-prop);
     object-fit:cover;display:block;
     background:var(--bg);border-bottom:1px solid var(--line);}
  .product .ph.sinfoto{display:grid;place-items:center;font-size:38px;
     background:linear-gradient(135deg,#fff,var(--line));}
  .product .b{padding:13px 14px 14px;display:flex;flex-direction:column;flex:1;}
  .product h3{font-size:15px;margin:0 0 3px;}
  .product .vendor{font-family:monospace;font-size:10.5px;color:var(--brand);margin-bottom:6px;}
  .product .d{font-size:12px;color:var(--ink-soft);margin:0 0 10px;line-height:1.4;flex:1;}
  .product .row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .product .pr{font-family:var(--precio-familia);font-weight:var(--precio-peso);
     font-size:var(--precio-tam);color:var(--brand);}
  .add{background:var(--brand);color:#fff;border:0;border-radius:var(--boton-radio);
     padding:8px 12px;font-weight:600;font-size:12.5px;
     text-transform:var(--boton-mayus);letter-spacing:.02em;}
  .add:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;}

  .overlay{position:fixed;inset:0;background:rgba(15,22,38,.4);opacity:0;pointer-events:none;transition:.25s;z-index:30;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:400px;max-width:92vw;background:var(--bg);z-index:40;transform:translateX(100%);transition:.28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.3);}
  .drawer.show{transform:none;}
  .drawer .dh{padding:22px 22px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
  .drawer .close{background:none;border:0;font-size:24px;color:var(--ink-soft);line-height:1;}
  .lines{flex:1;overflow-y:auto;padding:8px 22px;}
  .empty{text-align:center;color:var(--ink-soft);padding:60px 20px;font-size:14px;}
  .vgroup{margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
  .vgroup .vname{font-family:monospace;font-size:11px;color:var(--brand);font-weight:600;margin-bottom:8px;}
  .line{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center;font-size:13px;}
  .line:last-of-type{border-bottom:none;}
  .line .nm{flex:1;}
  .vfoot{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .foot{padding:18px 22px 22px;border-top:1px solid var(--line);background:var(--surface);}
  .totrow{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .totrow.big{font-size:17px;color:var(--ink);font-weight:600;margin:10px 0 14px;font-family:var(--display);}
  .pay-btn{width:100%;border:0;border-radius:11px;padding:14px;font-weight:600;font-size:14.5px;color:#fff;background:var(--brand);}
</style>
</head>
<body>

<div class="sysbar"><div class="in">
  <span class="tag">base: marketplace</span>
  <span>contexto: <b id="sysClient">Mercado Hecho a Mano</b></span>
  <span class="tag">dirección</span>
  <div class="toggle dirsw">
    <button type="button" data-d="mercado">Mercado</button>
    <button type="button" data-d="boutique">Boutique</button>
    <button type="button" data-d="taller">Taller</button>
  </div>
  <span class="tag">marca</span>
  <div class="toggle marcasw">
    <button type="button" class="on" onclick="verMarca(false)">Inicial</button>
    <button type="button" onclick="verMarca(true)">Logo y banner</button>
  </div>
  <span class="warn">split de pago automático no incluido — liquidación manual (ver README)</span>
</div></div>

<div class="app">
  <!-- Banner de la plataforma. Nace oculto: sin imagen no deja hueco. -->
  <img class="banner" id="banner" alt="" hidden>

  <div class="head">
    <div class="logo" id="logo">M</div>
    <h1 id="biz">Mercado Hecho a Mano</h1>
    <button type="button" class="cartbtn" onclick="openCart()">🛒 Carrito <span class="badge" id="count">0</span></button>
  </div>
  <!-- HERO. Nace oculto: sin titular no se muestra. -->
  <section class="hero" id="hero" hidden></section>

  <div class="grid" id="grid"></div>

  <!-- BLOQUES DE PÁGINA. Cada uno se pinta SOLO si la ficha lo trae. -->
  <section class="bloques" id="bloques" hidden></section>

  <!-- PIE. Contacto, horarios y dirección. Oculto si no hay nada que decir. -->
  <footer class="pie" id="pie" hidden></footer>
</div>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><h2>Tu pedido</h2><button type="button" class="close" onclick="closeCart()" aria-label="Cerrar">×</button></div>
  <div class="lines" id="lines"></div>
  <div class="foot" id="foot"></div>
</aside>

<script>
/* ── CONTEXTO ── */
const CONTEXT = {
  cliente: "Mercado Hecho a Mano",
  // La marca de la PLATAFORMA, no la de cada vendedor. Logo y banner
  // vacíos = inicial en un cuadro y sin banner: nunca una imagen inventada.
  marca: { primario:"#6A3CF0", secundario:"#F5F7FB", inicial:"M",
           direccion:"boutique",   // mercado | boutique | taller — ver el CSS
           logo:"", banner:"" },
  base_de_datos: { motor: "local" },
  apis: { pagos: "whatsapp", whatsapp_num: "573001112222" },
  /* LOS BLOQUES DE LA PÁGINA. Cada uno se pinta SOLO si trae contenido.
     Vacío = no existe; nunca se rellena con texto de ejemplo. */
  pagina: {
    hero: { titular: "Lo que hacen ocho talleres de la ciudad, en un solo lugar",
            bajada: "Compras una vez, cada taller te despacha lo suyo." },
    sobre: { titulo: "Cómo funciona",
             texto: "Reunimos talleres pequeños que ya venden bien pero no "
                  + "tienen tienda propia. Cada uno pone su precio y despacha "
                  + "lo suyo; nosotros cobramos una comisión por venta." },
    horarios: ["Atención a vendedores · lunes a viernes, 9:00 a 17:00"],
    ubicacion: { direccion: "" },
    redes: { instagram: "mercadohechoamano" }
  },
  comisionPorcentaje: 12,   // % que se queda la plataforma — ajusta según el contexto del proyecto
  moneda: "$",
};

/* ── DATOS (idéntico a src/data/local.adapter.js) ── */
let DATA = {
  vendedores: [
    { id:'v1', nombre:'Taller Norte', contacto:'573001112222' },
    { id:'v2', nombre:'Estudio Sur', contacto:'573003334444' },
  ],
  productos: [
    { id:'p1', vendedorId:'v1', nombre:'Maceta de barro', desc:'Hecha a mano, 20cm', precio:35000, emoji:'🪴', stock:10 },
    { id:'p2', vendedorId:'v1', nombre:'Cojín tejido', desc:'Algodón, 40x40', precio:58000, emoji:'🛋️', stock:6 },
    { id:'p3', vendedorId:'v2', nombre:'Lámpara de mesa', desc:'Madera y lino', precio:92000, emoji:'💡', stock:4 },
    { id:'p4', vendedorId:'v2', nombre:'Cuadro decorativo', desc:'Impresión en lienzo', precio:75000, emoji:'🖼️', stock:0 },
  ],
};

/* ── MOTOR DE CARRITO (idéntico a src/core/cart.js) ── */
function createCart(opts={}){
  const config={moneda:opts.moneda||'$',maxPorItem:opts.maxPorItem||99};
  let items=[]; const listeners=new Set();
  function compute(){
    const count=items.reduce((n,i)=>n+i.qty,0);
    const subtotal=items.reduce((n,i)=>n+i.precio*i.qty,0);
    return {items:[...items],count,subtotal,total:subtotal,config};
  }
  function emit(){const s=compute();listeners.forEach(fn=>fn(s));}
  function add(p,qty=1){const e=items.find(i=>i.id===p.id);if(e){e.qty=Math.min(e.qty+qty,config.maxPorItem);}else{items.push({...p,qty:Math.min(qty,config.maxPorItem)});}emit();}
  function increment(id){const it=items.find(i=>i.id===id);if(it){it.qty++;emit();}}
  function decrement(id){const it=items.find(i=>i.id===id);if(!it)return;it.qty--;if(it.qty<=0)items=items.filter(i=>i.id!==id);emit();}
  function subscribe(fn){listeners.add(fn);fn(compute());return ()=>listeners.delete(fn);}
  return {add,increment,decrement,subscribe,get:compute};
}
function money(n){ return CONTEXT.moneda+(n||0).toLocaleString('es-CO'); }

/* ---- SEGURIDAD (ver 03-componentes-ui/seguridad.js) ----
   Todo dato escrito por alguien que no seas tú pasa por esc()
   antes de tocar innerHTML. Sin esto, un nombre como
   <img src=x onerror=...> se ejecuta en la sesión del admin. */
function esc(v){
  if(v===null||v===undefined) return "";
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
/* Solo http(s) y rutas del propio sitio. Bloquea javascript: y data:,
   que en un src pueden ejecutar código en la sesión de quien mire.
   En un marketplace importa el doble: la foto la sube un vendedor. */
function urlSegura(v){
  const s=String(v||"").trim();
  if(!s) return "";
  if(/^https?:\/\//i.test(s) || s.startsWith("/") || s.startsWith("./")) return s;
  return "";
}
/* Foto del producto, con el emoji como respaldo. El alt lleva el nombre
   real — es lo que se lee si la foto no carga. */
function medio(p, clase="ph"){
  const src=urlSegura(p.imagen);
  return src
    ? `<img class="${clase}" src="${esc(src)}" alt="${esc(p.nombre||"")}" loading="lazy" decoding="async">`
    : `<div class="${clase} sinfoto" role="img" aria-label="${esc(p.nombre||"")}">${esc(p.emoji||"🛍️")}</div>`;
}
/* ---- LOGO Y BANNER DE LA PLATAFORMA ----
   Aguantan que el elemento no exista: borrar un id del marcado y que el
   script muera con él ya dejó una entrega en blanco. */
function pintarLogo(el, m, cliente){
  if(!el) return;
  const src = urlSegura(m && m.logo);
  el.textContent = "";
  if(src){
    const img = document.createElement("img");
    img.src = src; img.alt = cliente || ""; img.decoding = "async";
    el.appendChild(img);
    el.classList.add("conimg");
  } else {
    el.classList.remove("conimg");
    el.textContent = (m && m.inicial) || "";
  }
}
function pintarBanner(el, m, cliente){
  if(!el) return;
  const src = urlSegura(m && m.banner);
  if(!src){ el.hidden = true; el.removeAttribute("src"); return; }
  el.src = src; el.alt = cliente || "";
  el.loading = "lazy"; el.decoding = "async";
  el.hidden = false;
}


/* ── CHECKOUT MULTI-VENDEDOR (idéntico a src/core/checkout.js) ── */
function desglosePorVendedor(state){
  const porVendedor={};
  state.items.forEach(item=>{
    const vId=item.vendedorId;
    if(!porVendedor[vId]) porVendedor[vId]={vendedorId:vId,items:[],subtotal:0};
    porVendedor[vId].items.push(item);
    porVendedor[vId].subtotal += item.precio*item.qty;
  });
  return Object.values(porVendedor).map(g=>{
    const vendedor=DATA.vendedores.find(v=>v.id===g.vendedorId);
    const comision=Math.round(g.subtotal*(CONTEXT.comisionPorcentaje/100));
    return {vendedor:vendedor||{nombre:'Desconocido'}, items:g.items, subtotal:g.subtotal, comision, neto:g.subtotal-comision};
  });
}
function resumenTexto(state){
  const desglose=desglosePorVendedor(state);
  const lineas=desglose.map(g=>`${esc(g.vendedor.nombre)}: ${money(g.subtotal)} (neto: ${money(g.neto)})`).join('\n');
  return [`Hola, quiero hacer un pedido 🙌`,'',lineas,'',`Total: ${money(state.total)}`].join('\n');
}

const cart = createCart({ moneda: CONTEXT.moneda });

/* ── CATÁLOGO ── */
function renderCatalogo(){
  const grid=document.getElementById('grid'); grid.innerHTML='';
  DATA.productos.forEach(p=>{
    const vendedor = DATA.vendedores.find(v=>v.id===p.vendedorId);
    const agotado = p.stock<=0;
    const el=document.createElement('div'); el.className='product'+(agotado?' agotado':'');
    el.innerHTML=`${medio(p)}<div class="b">
      <h3>${esc(p.nombre)}</h3>
      <div class="vendor">vendido por ${esc(vendedor?.nombre||'—')}</div>
      <div class="d">${esc(p.desc||'')}</div>
      <div class="row"><span class="pr">${money(p.precio)}</span>
      <button type="button" class="add" ${agotado?'disabled':''}>${agotado?'Agotado':'Agregar'}</button></div>
    </div>`;
    if(!agotado) el.querySelector('.add').onclick=()=>{ cart.add(p,1); pulse(); };
    grid.appendChild(el);
  });
}

cart.subscribe(state=>{
  document.getElementById('count').textContent=state.count;
  renderLines(state); renderFoot(state);
});

function renderLines(state){
  const c=document.getElementById('lines');
  if(!state.items.length){ c.innerHTML='<div class="empty">Tu carrito está vacío.</div>'; return; }
  const desglose=desglosePorVendedor(state);
  c.innerHTML = desglose.map(g=>`
    <div class="vgroup">
      <div class="vname">${esc(g.vendedor.nombre)}</div>
      ${g.items.map(i=>`<div class="line"><span class="nm">${i.qty}× ${esc(i.nombre)}</span><span>${money(i.precio*i.qty)}</span></div>`).join('')}
      <div class="vfoot"><span>Comisión plataforma (${CONTEXT.comisionPorcentaje}%)</span><span>${money(g.comision)}</span></div>
      <div class="vfoot"><span>Neto para el vendedor</span><span>${money(g.neto)}</span></div>
    </div>`).join('');
}
function renderFoot(state){
  const f=document.getElementById('foot');
  if(!state.items.length){ f.innerHTML=''; return; }
  f.innerHTML=`
    <div class="totrow big"><span>Total</span><span>${money(state.total)}</span></div>
    <button type="button" class="pay-btn" id="payBtn">Pedir por WhatsApp</button>`;
  document.getElementById('payBtn').onclick=()=>{
    const num=CONTEXT.apis.whatsapp_num;
    window.open(`https://wa.me/${num}?text=${encodeURIComponent(resumenTexto(state))}`,'_blank');
  };
}

/* ====================================================================
   BLOQUES DE PÁGINA — lo que convierte un catálogo en un sitio.

   Regla única y no negociable: un bloque sin contenido NO se pinta.
   Ni con texto de ejemplo, ni con un "Próximamente", ni con una foto de
   banco. Un hueco honesto se ve mejor que un relleno inventado, y además
   le dice al dueño qué le falta mandar.
   ==================================================================== */
function pintarPagina(){
  const p = (CONTEXT.pagina) || {};

  // ── Hero ──
  const hero = document.getElementById('hero');
  if(hero){
    const t = String(p.hero && p.hero.titular || '').trim();
    const b = String(p.hero && p.hero.bajada || '').trim();
    if(t || b){
      hero.innerHTML = (t ? '<h2>'+esc(t)+'</h2>' : '')
                     + (b ? '<p>'+esc(b)+'</p>' : '');
      hero.hidden = false;
    } else { hero.hidden = true; }
  }

  // ── Sobre el negocio · horarios · dónde estamos ──
  const zona = document.getElementById('bloques');
  if(zona){
    const partes = [];

    const texto = String(p.sobre && p.sobre.texto || '').trim();
    if(texto){
      const titulo = String(p.sobre.titulo || 'Sobre nosotros').trim();
      partes.push('<div class="bloque"><h2>'+esc(titulo)+'</h2>'
        + '<p>'+esc(texto)+'</p></div>');
    }

    const horarios = Array.isArray(p.horarios) ? p.horarios.filter(Boolean) : [];
    if(horarios.length){
      partes.push('<div class="bloque"><h2>Horarios</h2><ul class="lista">'
        + horarios.map((h)=>'<li>'+esc(h)+'</li>').join('')
        + '</ul></div>');
    }

    const dir = String(p.ubicacion && p.ubicacion.direccion || '').trim();
    if(dir){
      // El enlace al mapa se arma con la dirección; no hace falta API ni clave.
      const mapa = 'https://www.google.com/maps/search/?api=1&query='
        + encodeURIComponent(dir);
      partes.push('<div class="bloque"><h2>Dónde estamos</h2><p>'+esc(dir)+'</p>'
        + '<a class="enlace" href="'+esc(mapa)+'" target="_blank" rel="noopener">'
        + 'Ver en el mapa</a></div>');
    }

    zona.innerHTML = partes.join('');
    zona.hidden = partes.length === 0;
  }

  // ── Pie ──
  const pie = document.getElementById('pie');
  if(pie){
    const trozos = [];
    const wa = String(CONTEXT.apis && CONTEXT.apis.whatsapp_num || '').replace(/\D/g,'');
    if(wa) trozos.push('<a class="enlace" href="https://wa.me/'+esc(wa)
      + '" target="_blank" rel="noopener">WhatsApp</a>');
    const ig = String(p.redes && p.redes.instagram || '').replace(/^@/,'').trim();
    if(ig) trozos.push('<a class="enlace" href="https://instagram.com/'+esc(ig)
      + '" target="_blank" rel="noopener">@'+esc(ig)+'</a>');
    const dir = String(p.ubicacion && p.ubicacion.direccion || '').trim();
    if(dir) trozos.push('<span>'+esc(dir)+'</span>');

    if(trozos.length){
      pie.innerHTML = '<div class="pie-in"><b>'+esc(CONTEXT.cliente)+'</b>'
        + trozos.join('') + '</div>';
      pie.hidden = false;
    } else { pie.hidden = true; }
  }
}

/** Las tres direcciones válidas. Cualquier otra cosa cae en "taller". */
const DIRECCIONES = ['mercado', 'boutique', 'taller'];

function pintarMarca(){
  const r=document.documentElement.style, m=CONTEXT.marca||{};
  if(m.primario) r.setProperty('--brand', m.primario);
  if(m.secundario) r.setProperty('--bg', m.secundario);
  // La dirección de arte cambia tipografía, escala, forma y ritmo — no solo
  // color. Ver el bloque DIRECCIONES DE ARTE en el CSS.
  document.documentElement.setAttribute('data-dir',
    DIRECCIONES.includes(m.direccion) ? m.direccion : 'taller');
  pintarLogo(document.getElementById('logo'), m, CONTEXT.cliente);
  pintarBanner(document.getElementById('banner'), m, CONTEXT.cliente);
  pintarPagina();
}
pintarMarca();
/* @demo-only
   Conmutador de la sysbar: enseña en vivo la diferencia entre entregar
   con la inicial y entregar con el logo del cliente. Los marcadores de
   arriba y abajo se los lleva crear-proyecto.js: al cliente no le llega
   ni esta función ni los SVG de ejemplo. */
function verMarca(con){
  CONTEXT.marca.logo   = con ? './logo-demo.svg'   : '';
  CONTEXT.marca.banner = con ? './banner-demo.svg' : '';
  pintarMarca();
  const sw = document.querySelector('.marcasw');
  if(sw) sw.querySelectorAll('button').forEach((b,n)=>
    b.classList.toggle('on', n === (con ? 1 : 0)));
}
(function cablearDirecciones(){
  const sw = document.querySelector('.dirsw');
  if(!sw) return;
  const marcar = (d) => sw.querySelectorAll('button').forEach((b) =>
    b.classList.toggle('on', b.dataset.d === d));
  sw.querySelectorAll('button').forEach((b) => {
    b.onclick = () => { CONTEXT.marca.direccion = b.dataset.d; pintarMarca(); marcar(b.dataset.d); };
  });
  marcar(document.documentElement.getAttribute('data-dir'));
})();
