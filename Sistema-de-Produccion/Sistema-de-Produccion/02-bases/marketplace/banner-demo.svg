<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img"
     aria-label="Banner de ejemplo">
  <!-- Banner de ejemplo para el conmutador de la sysbar. NO se entrega. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A3CF0"/>
      <stop offset="1" stop-color="#9A6CFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#g)"/>
  <circle cx="980" cy="90" r="140" fill="#F3ECE0" opacity=".12"/>
  <circle cx="240" cy="290" r="180" fill="#F3ECE0" opacity=".08"/>
  <text x="60" y="185" font-family="Georgia,serif" font-size="54" fill="#F3ECE0"
        opacity=".9">Foto de la plataforma</text>
</svg>
