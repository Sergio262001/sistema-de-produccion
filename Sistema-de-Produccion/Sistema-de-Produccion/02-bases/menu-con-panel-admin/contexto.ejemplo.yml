# ════════════════════════════════════════════════════════════
#  FICHA DE CONTEXTO — Base: menu-con-panel-admin
#  Copia este archivo por proyecto, llénalo, y pásamelo junto
#  con la base. NO pongas claves reales aquí (van en .env).
# ════════════════════════════════════════════════════════════

proyecto:   "Café Raíz — menú digital"
cliente:    "Café Raíz"
linea:      starter            # starter | pro
base:       menu-con-panel-admin

# ── BASE DE DATOS (tú eliges el motor) ──────────────────────
base_de_datos:
  motor:        supabase       # firebase | supabase | local
  necesita_auth: true          # el admin requiere login
  tablas:       [categorias, items]
  acceso:       rls_por_rol    # reglas de seguridad por rol

# ── APIs / CONECTORES ───────────────────────────────────────
apis:
  mensajeria:   whatsapp       # link | api | ninguno
  whatsapp_num: "573001234567"
  pagos:        wompi          # wompi | mercadopago | stripe | ninguno
  analitica:    ga4

# ── AUTH (login del panel admin — base: auth) ───────────────
auth:
  motor:          supabase     # firebase | supabase | local
  rol_requerido:  admin        # rol que necesita entrar al panel

# ── VARIABLES (solo nombres; valores reales en .env) ────────
env:
  - SUPABASE_URL
  - SUPABASE_ANON_KEY
  - GA4_ID

# ── MARCA (alimenta los tokens de diseño) ───────────────────
marca:
  # Logo y banner del local. URL completa (https://), ruta del propio
  # sitio (/img/logo.svg) o vacío. Vacío = se pinta la inicial y no se
  # muestra banner. No se rellenan con imágenes de archivo.
  logo:       ""
  banner:     ""
  inicial:    "R"
  primario:   "#1F6B4A"
  secundario: "#F3ECE0"
  acento:     "#C2703D"
  display:    "Fraunces"
  body:       "Inter"
  subtitulo:  "Cafetería de especialidad • Bogotá"
  tono:       "cercano, artesanal"

# ── ENTREGA ─────────────────────────────────────────────────
entrega:
  dominio:  "caferaiz.co"
  hosting:  vercel
  moneda:   "$"
  idiomas:  [es]
