<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base: Auth · Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#1B36C9;--bg:#F5F7FB;--surface:#fff;--ink:#0F1626;--ink-soft:#454F66;
    --line:#E2E7F0;--danger:#E5484D;--radius:14px;
    --display:'Space Grotesk',sans-serif;--body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:var(--display);margin:0;}

  .sysbar{background:#0C1322;color:#C9D2EA;font-family:monospace;font-size:12.5px;}
  .sysbar .in{max-width:1000px;margin:0 auto;padding:11px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .sysbar .tag{background:#1B2438;border:1px solid #2A3654;border-radius:6px;padding:3px 9px;color:#9BB0E0;}

  .wrap{max-width:420px;margin:60px auto;padding:0 20px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;}
  .card h2{font-size:21px;margin-bottom:4px;}
  .card .sub{font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tabs button{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px;font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;}
  .tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  form{display:flex;flex-direction:column;gap:10px;}
  input,select{font-family:inherit;font-size:14px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;}
  button[type=submit]{background:var(--brand);color:#fff;font-weight:600;font-size:14.5px;border:0;border-radius:9px;padding:12px;cursor:pointer;}
  .msg{font-size:13px;margin:0;min-height:16px;}
  .msg.err{color:var(--danger);}
  .msg.ok{color:#0FA56C;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:6px;}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;}
  .panel .who{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .avatar{width:42px;height:42px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;}
  .panel .rol{font-family:monospace;font-size:11px;background:var(--bg);padding:2px 8px;border-radius:6px;color:var(--ink-soft);}
  .logout{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;font-weight:600;font-size:13.5px;cursor:pointer;width:100%;}
  .gate{margin-top:16px;padding:14px;border-radius:10px;background:#FBE6E7;color:#9B1C22;font-size:13.5px;display:none;}
  .gate.show{display:block;}
</style>
</head>
<body>

<div class="sysbar"><div class="in">
  <span class="tag">base: auth</span>
  <span>motor: <b id="sysMotor">local</b></span>
</div></div>

<div class="wrap" id="app"></div>

<script>
/* ── Adaptador LOCAL (idéntico a src/core/local.adapter.js) ── */
const USERS = [{ email: 'admin@demo.com', password: 'admin123', rol: 'admin', nombre: 'Admin Demo' }];
let current = null;
const listeners = new Set();
function emit(){ listeners.forEach(fn => fn(current)); }
const auth = {
  async register(email, password, meta = {}) {
    if (USERS.some(u => u.email === email)) throw new Error('Ese correo ya está registrado');
    USERS.push({ email, password, rol: meta.rol || 'cliente', nombre: meta.nombre || '' });
    current = { email, rol: meta.rol || 'cliente', nombre: meta.nombre || '' };
    emit(); return { ok: true, user: current };
  },
  async login(email, password) {
    const u = USERS.find(u => u.email === email && u.password === password);
    if (!u) throw new Error('Correo o contraseña incorrectos');
    current = { email: u.email, rol: u.rol, nombre: u.nombre };
    emit(); return { ok: true, user: current };
  },
  async logout() { current = null; emit(); return { ok: true }; },
  subscribe(fn) { listeners.add(fn); fn(current); return () => listeners.delete(fn); },
};

/* CONTEXTO — qué rol puede entrar al panel protegido de esta demo */
const CONTEXT = { rolRequerido: 'admin' };

const app = document.getElementById('app');

function renderLogin() {
  app.innerHTML = `
    <div class="card">
      <h2>Acceder al panel</h2>
      <p class="sub">Demo: admin@demo.com / admin123, o regístrate como cliente.</p>
      <div class="tabs">
        <button type="button" class="on" id="tabLogin">Iniciar sesión</button>
        <button type="button" id="tabRegister">Registrarme</button>
      </div>
      <form id="authForm">
        <input name="email" type="email" placeholder="correo@ejemplo.com" required>
        <input name="password" type="password" placeholder="Contraseña" required minlength="6">
        <div id="extraFields"></div>
        <button type="submit" id="submitBtn">Iniciar sesión</button>
        <p class="msg" id="authMsg" role="status"></p>
      </form>
    </div>`;

  let modo = 'login';
  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const extra = document.getElementById('extraFields');
  const submitBtn = document.getElementById('submitBtn');
  const msg = document.getElementById('authMsg');

  function setModo(m) {
    modo = m;
    tabLogin.classList.toggle('on', m === 'login');
    tabRegister.classList.toggle('on', m === 'register');
    submitBtn.textContent = m === 'login' ? 'Iniciar sesión' : 'Crear cuenta';
    extra.innerHTML = m === 'register' ? `<input name="nombre" type="text" placeholder="Tu nombre">` : '';
    msg.textContent = ''; msg.className = 'msg';
  }
  tabLogin.onclick = () => setModo('login');
  tabRegister.onclick = () => setModo('register');

  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const email = f.email.value.trim();
    const password = f.password.value;
    try {
      if (modo === 'login') await auth.login(email, password);
      else await auth.register(email, password, { rol: 'cliente', nombre: f.nombre?.value || '' });
      msg.textContent = '¡Listo!'; msg.className = 'msg ok';
    } catch (err) {
      msg.textContent = err.message; msg.className = 'msg err';
    }
  });
}

function renderPanel(user) {
  const inicial = (user.nombre || user.email)[0].toUpperCase();
  const puedeEntrar = user.rol === CONTEXT.rolRequerido;
  app.innerHTML = `
    <div class="panel">
      <div class="who">
        <div class="avatar">${inicial}</div>
        <div><div><b>${user.nombre || user.email}</b></div><span class="rol">${user.rol}</span></div>
      </div>
      <p class="hint">Este panel exige el rol <b>${CONTEXT.rolRequerido}</b> para ver datos sensibles.</p>
      <div class="gate ${puedeEntrar ? '' : 'show'}">Tu rol (<b>${user.rol}</b>) no tiene acceso a esta sección. Pide a un admin que te asigne el rol correcto.</div>
      ${puedeEntrar ? '<p class="hint">✅ Acceso concedido: aquí iría el panel de edición real (menú, leads, pedidos…).</p>' : ''}
      <button type="button" class="logout" id="logoutBtn">Cerrar sesión</button>
    </div>`;
  document.getElementById('logoutBtn').onclick = () => auth.logout();
}

auth.subscribe(user => {
  if (user) renderPanel(user); else renderLogin();
});
</script>
</body>
</html>
