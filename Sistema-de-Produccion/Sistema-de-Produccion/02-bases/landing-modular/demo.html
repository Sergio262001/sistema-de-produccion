<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base: Landing Modular · Demo</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ══════════════════════════════════════════════════════════════
     DIRECCIONES DE ARTE
     Esta base es la que más vive del diseño y era la peor diseñada:
     40 líneas de CSS, cero :hover, cero media queries, hero centrado
     con emojis de icono. Justo lo que ya se había rechazado al
     rehacer la página del estudio.
     Se elige en la ficha:  marca.direccion: mercado | boutique | taller
     ══════════════════════════════════════════════════════════════ */
  :root{
    --brand:#2F54FF;--bg:#F5F7FB;--surface:#fff;--ink:#0F1626;
    --ink-soft:#454F66;--line:#E2E7F0;--danger:#B23A2E;

    /* Valores por defecto = dirección "taller" */
    --display:'IBM Plex Sans',system-ui,sans-serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --radius:8px;--borde:1px;
    --peso-titulo:600;--tracking:-.015em;--ritmo:1;
    --eyebrow-familia:var(--mono);--eyebrow-mayus:uppercase;
    --boton-radio:8px;--boton-mayus:none;
    --hero-ancho:22ch;
  }

  /* MERCADO — directo, alto contraste, sin rodeos.
     Servicios de barrio, oficios, negocios de volumen: quien entra
     quiere saber qué haces y cómo te contacta, no admirar la página. */
  [data-dir="mercado"]{
    --display:'Archivo',system-ui,sans-serif;
    --body:'Archivo',system-ui,sans-serif;
    --radius:3px;--borde:2px;
    --peso-titulo:800;--tracking:-.035em;--ritmo:.85;
    --boton-radio:3px;--boton-mayus:uppercase;
    --hero-ancho:18ch;
  }
  [data-dir="mercado"] .hero h1{text-transform:uppercase;}
  [data-dir="mercado"] .servicio{border-left:4px solid var(--ink);padding-left:18px;}
  [data-dir="mercado"] .cta{box-shadow:4px 4px 0 var(--ink);}
  [data-dir="mercado"] .cta:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
  [data-dir="mercado"] .logo{border-radius:4px;}

  /* BOUTIQUE — editorial, con aire. Estudios, consultorios, marcas
     que se venden por criterio y no por precio. */
  [data-dir="boutique"]{
    --display:'Fraunces',Georgia,serif;
    --body:'Karla',system-ui,sans-serif;
    --radius:0px;--borde:1px;
    --peso-titulo:400;--tracking:-.01em;--ritmo:1.5;
    --eyebrow-familia:var(--body);--eyebrow-mayus:none;
    --boton-radio:0px;--hero-ancho:16ch;
  }
  [data-dir="boutique"] .eyebrow{letter-spacing:.02em;font-style:italic;}
  [data-dir="boutique"] .servicio{border-top:1px solid var(--line);padding-top:20px;}
  [data-dir="boutique"] .servicio h3{font-family:var(--display);font-size:21px;}
  [data-dir="boutique"] .cta{background:var(--ink);}
  [data-dir="boutique"] .logo{border-radius:0;}
  [data-dir="boutique"] .banner{border-radius:0;}

  /* TALLER — ficha técnica. B2B, servicios técnicos, proveedores. */
  [data-dir="taller"] .servicio{border-top:1px solid var(--line);padding-top:16px;}
  [data-dir="taller"] .servicio h3{font-family:var(--body);}

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
    -webkit-font-smoothing:antialiased;line-height:1.5;}
  h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;
    font-weight:var(--peso-titulo);letter-spacing:var(--tracking);}
  p{margin:0;}
  button,input,textarea{font-family:inherit;font-size:inherit;}
  button{cursor:pointer;}
  a{color:inherit;}

  /* Foco visible: sin esto la página no se puede navegar por teclado, y
     es una de las reglas que el validador exige antes de entregar. */
  :focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:2px;}
  .saltar{position:absolute;left:-9999px;background:var(--ink);color:#fff;
    padding:10px 16px;z-index:50;}
  .saltar:focus{left:12px;top:12px;}

  .sysbar{background:#0C1322;color:#C9D2EA;font-family:monospace;font-size:12.5px;}
  .sysbar .in{max-width:1000px;margin:0 auto;padding:11px 20px;display:flex;
    gap:14px;align-items:center;flex-wrap:wrap;}
  .sysbar .tag{background:#1B2438;border:1px solid #2A3654;border-radius:6px;
    padding:3px 9px;color:#9BB0E0;}
  .sysbar b{color:#fff;}
  .toggle{display:flex;background:#1B2438;border:1px solid #2A3654;
    border-radius:8px;overflow:hidden;}
  .toggle button{background:transparent;border:0;color:#9BB0E0;
    font-family:monospace;font-size:12px;padding:6px 13px;}
  .toggle button.on{background:var(--brand);color:#fff;}

  .wrap{max-width:1000px;margin:0 auto;padding:0 24px;}

  /* ---- CABECERA ---- */
  .top{display:flex;align-items:center;gap:14px;padding:26px 0 0;}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--brand);
    color:#fff;display:grid;place-items:center;font-family:var(--display);
    font-weight:700;font-size:21px;flex:none;}
  .logo.conimg{background:none;overflow:hidden;}
  .logo img{width:100%;height:100%;object-fit:contain;display:block;}
  .top .nombre{font-family:var(--display);font-weight:600;font-size:17px;}
  .banner{display:block;width:100%;max-height:260px;object-fit:cover;
    border-radius:14px;margin:22px 0 0;background:var(--line);}
  .banner[hidden]{display:none;}

  /* ---- HERO ----
     No centrado. El texto alineado a la izquierda se lee mejor y deja
     que el titular ocupe el ancho que quiera sin parecer un cartel. */
  .hero{padding:calc(56px * var(--ritmo)) 0 calc(40px * var(--ritmo));}
  .eyebrow{font-family:var(--eyebrow-familia);font-size:12px;
    text-transform:var(--eyebrow-mayus);letter-spacing:.09em;
    color:var(--brand);margin-bottom:18px;display:block;}
  .hero h1{font-size:clamp(34px,7vw,68px);max-width:var(--hero-ancho);}
  .hero .lead{margin-top:20px;max-width:52ch;font-size:clamp(16px,2vw,19px);
    color:var(--ink-soft);line-height:1.55;}
  .cta{display:inline-block;margin-top:30px;background:var(--brand);color:#fff;
    font-weight:600;font-size:15px;padding:14px 26px;border-radius:var(--boton-radio);
    text-decoration:none;text-transform:var(--boton-mayus);letter-spacing:.02em;
    transition:transform .14s ease,box-shadow .14s ease,opacity .14s ease;}
  .cta:hover{opacity:.92;transform:translateY(-1px);}

  /* ---- SECCIONES ---- */
  .seccion{padding:calc(44px * var(--ritmo)) 0;
    border-top:var(--borde) solid var(--line);}
  .seccion > h2{font-size:clamp(22px,3.4vw,30px);margin-bottom:26px;
    max-width:24ch;}
  .seccion[hidden]{display:none;}

  /* Servicios: lista, no tarjetas con emoji. El emoji como icono es de las
     marcas más claras de plantilla generada, y no dice nada del negocio. */
  .servicios{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:calc(26px * var(--ritmo)) 30px;}
  .servicio h3{font-size:18px;margin-bottom:8px;}
  .servicio p{color:var(--ink-soft);font-size:14.5px;line-height:1.6;}

  .prosa{max-width:62ch;font-size:16px;line-height:1.7;color:var(--ink);}
  .lista{list-style:none;margin:0;padding:0;font-size:15px;line-height:2;}
  .dosc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:calc(26px * var(--ritmo)) 30px;}
  .rotulo{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;
    letter-spacing:.09em;color:var(--ink-soft);margin-bottom:10px;}
  .enlace{display:inline-block;margin-top:10px;color:var(--brand);
    font-size:14px;font-weight:600;text-decoration:none;
    border-bottom:1px solid currentColor;}
  .enlace:hover{opacity:.75;}

  /* ---- FORMULARIO ---- */
  form{max-width:480px;display:flex;flex-direction:column;gap:12px;}
  .campo label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  input,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--surface);color:var(--ink);
    transition:border-color .14s;}
  input:hover,textarea:hover{border-color:var(--ink-soft);}
  textarea{resize:vertical;min-height:96px;}
  form button{background:var(--brand);color:#fff;font-weight:600;border:0;
    border-radius:var(--boton-radio);padding:14px;margin-top:4px;
    text-transform:var(--boton-mayus);letter-spacing:.02em;transition:opacity .14s;}
  form button:hover{opacity:.92;}
  .msg{min-height:20px;font-size:14px;color:var(--brand);}
  .msg.mal{color:var(--danger);}

  footer{border-top:var(--borde) solid var(--line);padding:24px 0 60px;
    display:flex;flex-wrap:wrap;gap:16px;align-items:center;
    font-size:13.5px;color:var(--ink-soft);}
  footer b{font-family:var(--display);font-size:15px;color:var(--ink);}

  @media(max-width:600px){
    .wrap{padding:0 18px;}
    .hero{padding:34px 0 26px;}
  }
  /* Quien pidió menos movimiento no debería recibir más. */
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
    .cta:hover{transform:none;}
  }
</style>
</head>
<body>

<a class="saltar" href="#contenido">Saltar al contenido</a>

<div class="sysbar"><div class="in">
  <span class="tag">base: landing-modular</span>
  <span>contexto: <b id="sysClient">Estudio Lumen</b></span>
  <span class="tag">dirección</span>
  <div class="toggle dirsw">
    <button type="button" data-d="mercado">Mercado</button>
    <button type="button" data-d="boutique">Boutique</button>
    <button type="button" data-d="taller">Taller</button>
  </div>
  <span class="tag">leads: <b id="sysDB">local</b></span>
</div></div>

<div class="wrap">
  <header class="top">
    <div class="logo" id="logo">E</div>
    <span class="nombre" id="biz">Estudio Lumen</span>
  </header>
  <img class="banner" id="banner" alt="" hidden>
</div>

<main class="wrap" id="contenido">
  <section class="hero" id="hero" hidden></section>
  <section class="seccion" id="servicios" hidden></section>
  <section class="seccion" id="sobre" hidden></section>
  <section class="seccion" id="datos" hidden></section>

  <section class="seccion" id="leads">
    <h2 id="leadsTitulo">Hablemos de tu proyecto</h2>
    <form id="leadForm" novalidate>
      <div class="campo">
        <label for="lNombre">Tu nombre</label>
        <input id="lNombre" name="nombre" type="text" autocomplete="name" required>
      </div>
      <div class="campo">
        <label for="lContacto">WhatsApp o correo</label>
        <input id="lContacto" name="contacto" type="text" autocomplete="tel" required>
      </div>
      <div class="campo">
        <label for="lMensaje">Cuéntanos qué necesitas</label>
        <textarea id="lMensaje" name="mensaje" rows="3"></textarea>
      </div>
      <button type="submit">Enviar</button>
      <p class="msg" id="leadMsg" role="status" aria-live="polite"></p>
    </form>
  </section>

  <footer id="pie"></footer>
</main>

<script>
/* ════════════════════════════════════════════════════════════
   1) CONTEXTO — vendría de la ficha contexto.proyecto.yml
   ════════════════════════════════════════════════════════════ */
const CONTEXT = {
  cliente: "Estudio Lumen",
  marca: {
    primario:"#2F54FF", secundario:"#F5F7FB", inicial:"E",
    direccion:"boutique",   // mercado | boutique | taller — ver el CSS
    logo:"", banner:""
  },
  /* LOS BLOQUES DE LA PÁGINA. Cada uno se pinta SOLO si trae contenido.
     Vacío = no existe; nunca se rellena con texto de ejemplo, ni con un
     "Próximamente", ni con foto de banco. */
  pagina: {
    hero: { eyebrow:"Estudio de diseño · Medellín",
            titular:"Sitios que explican bien lo que vendes",
            bajada:"Diseño y desarrollo para negocios pequeños que ya "
                 + "funcionan y necesitan que su página lo demuestre.",
            cta:"Cuéntanos tu proyecto" },
    servicios_titulo: "Lo que hacemos",
    servicios: [
      { titulo:"Landing pages", desc:"Una página que explica el negocio y recoge contactos." },
      { titulo:"Menús digitales", desc:"La carta en el celular, con panel para editarla sin llamarnos." },
      { titulo:"Tiendas en línea", desc:"Catálogo, inventario y carrito, conectados a tu pasarela." },
      { titulo:"Identidad y UX", desc:"Marca, tipografía y estructura antes de escribir código." },
    ],
    sobre: { titulo:"Cómo trabajamos",
             texto:"Empezamos por el contenido real, no por la plantilla: "
                 + "qué vendes, a quién y qué te preguntan siempre. Con eso "
                 + "definimos la estructura, y solo después el diseño. Se "
                 + "entrega funcionando, no en una presentación." },
    horarios: ["Lunes a viernes · 9:00 a 18:00"],
    ubicacion: { direccion:"" },
    redes: { instagram:"" }
  },
  apis: { mensajeria:"whatsapp", whatsapp_num:"573001234567" },
  base_de_datos: { motor:"local" },
};

/* ---- SEGURIDAD (ver 03-componentes-ui/seguridad.js) ----
   Todo dato que no escribas tú pasa por esc() antes de tocar innerHTML.
   Esta base lo tenía sin escapar: el titular, los servicios y el pie se
   interpolaban directo, y ese contenido sale del brief del cliente. */
function esc(v){
  if(v===null||v===undefined) return "";
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
/* Solo http(s) y rutas del propio sitio: bloquea javascript: y data:. */
function urlSegura(v){
  const s=String(v||"").trim();
  if(!s) return "";
  if(/^https?:\/\//i.test(s) || s.startsWith("/") || s.startsWith("./")) return s;
  return "";
}
function esEmailValido(v){const s=String(v||"").trim();return s.length<=254&&/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s);}
function esTelefonoValido(v){return /^\d{7,15}$/.test(String(v||"").replace(/[\s()+-]/g,""));}
function limpiarTexto(v,max=500){
  return String(v??"").replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g,"").trim().slice(0,max);
}

/* ---- LOGO Y BANNER ----
   Aguantan que el elemento no exista: borrar un id del marcado y que el
   script muera con él ya dejó una entrega en blanco. */
function pintarLogo(el, m, cliente){
  if(!el) return;
  const src = urlSegura(m && m.logo);
  el.textContent = "";
  if(src){
    const img = document.createElement("img");
    img.src = src; img.alt = cliente || ""; img.decoding = "async";
    el.appendChild(img);
    el.classList.add("conimg");
  } else {
    el.classList.remove("conimg");
    el.textContent = (m && m.inicial) || "";
  }
}
function pintarBanner(el, m, cliente){
  if(!el) return;
  const src = urlSegura(m && m.banner);
  if(!src){ el.hidden = true; el.removeAttribute("src"); return; }
  el.src = src; el.alt = cliente || "";
  el.loading = "lazy"; el.decoding = "async";
  el.hidden = false;
}

/* ════════════════════════════════════════════════════════════
   2) SECCIONES — cada una se pinta SOLO si trae contenido.
      Una sección vacía no se rellena: se omite. El hueco dice la
      verdad sobre lo que falta pedirle al cliente.
   ════════════════════════════════════════════════════════════ */
function pintarHero(){
  const el = document.getElementById("hero");
  if(!el) return;
  const h = (CONTEXT.pagina && CONTEXT.pagina.hero) || {};
  const t = String(h.titular||"").trim();
  const b = String(h.bajada||"").trim();
  if(!t && !b){ el.hidden = true; return; }
  const eyebrow = String(h.eyebrow||"").trim();
  const cta = String(h.cta||"").trim();
  el.innerHTML =
      (eyebrow ? '<span class="eyebrow">'+esc(eyebrow)+'</span>' : '')
    + (t ? '<h1>'+esc(t)+'</h1>' : '')
    + (b ? '<p class="lead">'+esc(b)+'</p>' : '')
    + (cta ? '<a class="cta" href="#leads">'+esc(cta)+'</a>' : '');
  el.hidden = false;
}

function pintarServicios(){
  const el = document.getElementById("servicios");
  if(!el) return;
  const lista = (CONTEXT.pagina && CONTEXT.pagina.servicios) || [];
  const items = lista.filter((s)=>s && String(s.titulo||"").trim());
  if(!items.length){ el.hidden = true; return; }
  const titulo = String((CONTEXT.pagina.servicios_titulo)||"Lo que hacemos").trim();
  el.innerHTML = '<h2>'+esc(titulo)+'</h2><div class="servicios">'
    + items.map((s)=>'<article class="servicio"><h3>'+esc(s.titulo)+'</h3>'
        + (String(s.desc||"").trim() ? '<p>'+esc(s.desc)+'</p>' : '')
        + '</article>').join('')
    + '</div>';
  el.hidden = false;
}

function pintarSobre(){
  const el = document.getElementById("sobre");
  if(!el) return;
  const s = (CONTEXT.pagina && CONTEXT.pagina.sobre) || {};
  const texto = String(s.texto||"").trim();
  if(!texto){ el.hidden = true; return; }
  el.innerHTML = '<h2>'+esc(String(s.titulo||"Sobre nosotros").trim())+'</h2>'
    + '<p class="prosa">'+esc(texto)+'</p>';
  el.hidden = false;
}

function pintarDatos(){
  const el = document.getElementById("datos");
  if(!el) return;
  const p = CONTEXT.pagina || {};
  const partes = [];

  const horarios = Array.isArray(p.horarios) ? p.horarios.filter(Boolean) : [];
  if(horarios.length){
    partes.push('<div><div class="rotulo">Horarios</div><ul class="lista">'
      + horarios.map((h)=>'<li>'+esc(h)+'</li>').join('') + '</ul></div>');
  }
  const dir = String(p.ubicacion && p.ubicacion.direccion || "").trim();
  if(dir){
    const mapa = "https://www.google.com/maps/search/?api=1&query="
      + encodeURIComponent(dir);
    partes.push('<div><div class="rotulo">Dónde estamos</div>'
      + '<p class="prosa">'+esc(dir)+'</p>'
      + '<a class="enlace" href="'+esc(mapa)+'" target="_blank" rel="noopener">'
      + 'Ver en el mapa</a></div>');
  }
  if(!partes.length){ el.hidden = true; return; }
  el.innerHTML = '<div class="dosc">'+partes.join('')+'</div>';
  el.hidden = false;
}

function pintarPie(){
  const el = document.getElementById("pie");
  if(!el) return;
  const p = CONTEXT.pagina || {};
  const trozos = [];
  const wa = String(CONTEXT.apis && CONTEXT.apis.whatsapp_num || "").replace(/\D/g,"");
  if(wa) trozos.push('<a class="enlace" href="https://wa.me/'+esc(wa)
    + '" target="_blank" rel="noopener">WhatsApp</a>');
  const ig = String(p.redes && p.redes.instagram || "").replace(/^@/,"").trim();
  if(ig) trozos.push('<a class="enlace" href="https://instagram.com/'+esc(ig)
    + '" target="_blank" rel="noopener">@'+esc(ig)+'</a>');
  el.innerHTML = '<b>'+esc(CONTEXT.cliente)+'</b>' + trozos.join('');
}

/** Las tres direcciones válidas. Cualquier otra cosa cae en "taller". */
const DIRECCIONES = ['mercado', 'boutique', 'taller'];

function applyTheme(){
  const m = CONTEXT.marca || {}, r = document.documentElement.style;
  if(m.primario) r.setProperty('--brand', m.primario);
  if(m.secundario) r.setProperty('--bg', m.secundario);
  // La tipografía la manda la DIRECCIÓN. Esto es un estilo en línea y le
  // gana a [data-dir], así que solo se aplica si el cliente trae la suya.
  if(m.display) r.setProperty('--display', m.display);
  if(m.body) r.setProperty('--body', m.body);

  document.documentElement.setAttribute('data-dir',
    DIRECCIONES.includes(m.direccion) ? m.direccion : 'taller');

  pintarLogo(document.getElementById('logo'), m, CONTEXT.cliente);
  pintarBanner(document.getElementById('banner'), m, CONTEXT.cliente);
  document.getElementById('biz').textContent = CONTEXT.cliente;
  document.getElementById('sysClient').textContent = CONTEXT.cliente;
  document.getElementById('sysDB').textContent = CONTEXT.base_de_datos.motor;

  pintarHero(); pintarServicios(); pintarSobre(); pintarDatos(); pintarPie();
}

/* ── Adaptador de datos (idéntico a src/data/local.adapter.js) ── */
let leads = [];
const db = {
  async save(lead) {
    leads.push({ ...lead, id: crypto.randomUUID(), fecha: new Date().toISOString() });
    return { ok: true, motor: 'local' };
  },
};

/* ── Formulario de contactos ── */
const form = document.getElementById('leadForm');
const msg = document.getElementById('leadMsg');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const lead = {
    nombre: limpiarTexto(form.nombre.value, 80),
    contacto: limpiarTexto(form.contacto.value, 120),
    mensaje: limpiarTexto(form.mensaje.value, 500),
  };
  msg.classList.remove('mal');
  if (!lead.nombre) {
    msg.textContent = 'Falta tu nombre.'; msg.classList.add('mal');
    form.nombre.focus(); return;
  }
  if (!esEmailValido(lead.contacto) && !esTelefonoValido(lead.contacto)) {
    msg.textContent = 'Escribe un WhatsApp o un correo con el que podamos responderte.';
    msg.classList.add('mal'); form.contacto.focus(); return;
  }
  await db.save(lead);
  msg.textContent = 'Recibido. Te escribimos pronto.';
  form.reset();
  if (CONTEXT.apis.mensajeria === 'whatsapp' && CONTEXT.apis.whatsapp_num) {
    const texto = 'Hola, soy ' + lead.nombre + '. '
      + (lead.mensaje || 'Quiero más información.');
    window.open('https://wa.me/' + CONTEXT.apis.whatsapp_num
      + '?text=' + encodeURIComponent(texto), '_blank', 'noopener');
  }
});

applyTheme();

/* @demo-only
   Conmutador de la sysbar: enseña en vivo la diferencia entre las tres
   direcciones. Los marcadores de arriba y abajo se los lleva
   crear-proyecto.js: al cliente no le llega esta función. */
(function cablearDirecciones(){
  const sw = document.querySelector('.dirsw');
  if(!sw) return;
  const marcar = (d) => sw.querySelectorAll('button').forEach((b) =>
    b.classList.toggle('on', b.dataset.d === d));
  sw.querySelectorAll('button').forEach((b) => {
    b.onclick = () => { CONTEXT.marca.direccion = b.dataset.d; applyTheme(); marcar(b.dataset.d); };
  });
  marcar(document.documentElement.getAttribute('data-dir'));
})();
/* @fin-demo */
</script>
