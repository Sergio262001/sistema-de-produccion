<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base: Landing Modular · Demo</title>

<!-- ══════════════════════════════════════════════════════════════
     SEO Y VISTA PREVIA AL COMPARTIR (Open Graph + Twitter Card)

     Van en el HTML ESTÁTICO, no inyectados por JS: los rastreadores de
     WhatsApp, Facebook y LinkedIn leen el <head> sin ejecutar JavaScript.
     Si estos valores se pintaran desde el CONTEXT al arrancar, el enlace
     compartido saldría con el texto del ejemplo.

     crear-proyecto.js los reemplaza con los datos del cliente.
     ══════════════════════════════════════════════════════════════ -->
<meta name="description" content="Landing modular por secciones, configurada desde la ficha de contexto.">
<meta property="og:type" content="website">
<meta property="og:title" content="Estudio Lumen">
<meta property="og:description" content="Landing modular por secciones, configurada desde la ficha de contexto.">
<meta property="og:image" content="">
<meta property="og:url" content="">
<meta property="og:locale" content="es_CO">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ══════════════════════════════════════════════════════════════
     DIRECCIONES DE ARTE
     Esta base es la que más vive del diseño y era la peor diseñada:
     40 líneas de CSS, cero :hover, cero media queries, hero centrado
     con emojis de icono. Justo lo que ya se había rechazado al
     rehacer la página del estudio.
     Se elige en la ficha:  marca.direccion: mercado | boutique | taller
     ══════════════════════════════════════════════════════════════ */
  :root{
    /* NEUTROS ELEGIDOS. Esta base sigue el método de Linear/Stripe/Vercel:
       base monocromática de verdad + UN acento que hace todo el trabajo.
       Antes el suelo era #F5F7FB y la tinta #0F1626 — ambos azules, como el
       acento: el azul eléctrico no tenía contra qué empujar. Ahora blanco
       puro y negro casi puro, y el #2F54FF es lo único con color en pantalla. */
    --brand:#2F54FF;--bg:#FFFFFF;--surface:#FAFAFA;--ink:#0A0A0B;
    --ink-soft:#5A5A5F;--line:#E5E5E5;--danger:#B23A2E;
    /* El SEGUNDO color de marca, para las identidades que tienen dos (un
       azul institucional y un dorado, por ejemplo). Por defecto es el mismo
       acento que la marca, así que una base sin acento se ve igual que antes.
       Lo pidió el primer cliente real: la mitad de su identidad es el dorado,
       y la landing no tenía dónde ponerlo. */
    --accent:var(--brand);

    /* Valores por defecto = dirección "taller" */
    --display:'IBM Plex Sans',system-ui,sans-serif;
    --body:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --radius:8px;--borde:1px;
    --peso-titulo:600;--tracking:-.015em;--ritmo:1;
    --eyebrow-familia:var(--mono);--eyebrow-mayus:uppercase;
    --boton-radio:8px;--boton-mayus:none;
    --hero-ancho:22ch;
  }

  /* MERCADO — directo, alto contraste, sin rodeos.
     Servicios de barrio, oficios, negocios de volumen: quien entra
     quiere saber qué haces y cómo te contacta, no admirar la página. */
  [data-dir="mercado"]{
    --display:'Archivo',system-ui,sans-serif;
    --body:'Archivo',system-ui,sans-serif;
    --radius:3px;--borde:2px;
    --peso-titulo:800;--tracking:-.035em;--ritmo:.85;
    --boton-radio:3px;--boton-mayus:uppercase;
    --hero-ancho:18ch;
  }
  [data-dir="mercado"] .hero h1{text-transform:uppercase;}
  [data-dir="mercado"] .servicio{border-left:4px solid var(--ink);padding-left:18px;}
  [data-dir="mercado"] .cta{box-shadow:4px 4px 0 var(--ink);}
  [data-dir="mercado"] .cta:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
  [data-dir="mercado"] .logo{border-radius:4px;}

  /* BOUTIQUE — editorial, con aire. Estudios, consultorios, marcas
     que se venden por criterio y no por precio. */
  [data-dir="boutique"]{
    --display:'Fraunces',Georgia,serif;
    --body:'Karla',system-ui,sans-serif;
    --radius:0px;--borde:1px;
    --peso-titulo:400;--tracking:-.01em;--ritmo:1.5;
    --eyebrow-familia:var(--body);--eyebrow-mayus:none;
    --boton-radio:0px;--hero-ancho:16ch;
  }
  [data-dir="boutique"] .eyebrow{letter-spacing:.02em;font-style:italic;}
  [data-dir="boutique"] .servicio{border-top:1px solid var(--line);padding-top:20px;}
  [data-dir="boutique"] .servicio h3{font-family:var(--display);font-size:21px;}
  [data-dir="boutique"] .cta{background:var(--ink);}
  [data-dir="boutique"] .logo{border-radius:0;}
  [data-dir="boutique"] .banner{border-radius:0;}

  /* TALLER — ficha técnica. B2B, servicios técnicos, proveedores. */
  [data-dir="taller"] .servicio{border-top:1px solid var(--line);padding-top:16px;}
  [data-dir="taller"] .servicio h3{font-family:var(--body);}

  /* Las cuatro secciones nuevas también responden a la dirección, o serían
     el mismo bloque para los tres mundos visuales. */
  [data-dir="mercado"] .dif-i{border-top-width:4px;border-top-color:var(--ink);}
  [data-dir="mercado"] .paso-n{border-radius:3px;}
  [data-dir="mercado"] .sect li{border-width:2px;border-color:var(--ink);
    color:var(--ink);font-weight:600;}
  [data-dir="mercado"] .gal-i:hover img{transform:none;}

  [data-dir="boutique"] .dif-i{border-top:1px solid var(--line);}
  [data-dir="boutique"] .dif-i h3{font-family:var(--display);font-size:19px;}
  [data-dir="boutique"] .paso-n{background:transparent;color:var(--ink-soft);
    border:1px solid var(--line);font-family:var(--body);}
  [data-dir="boutique"] .paso h3{text-transform:none;letter-spacing:0;
    font-family:var(--display);font-size:17px;}
  [data-dir="boutique"] .sect li{border:0;border-bottom:1px solid var(--line);
    border-radius:0;padding:8px 2px;}
  [data-dir="boutique"] .gal{gap:22px;}

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);
    -webkit-font-smoothing:antialiased;line-height:1.5;}
  h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;
    font-weight:var(--peso-titulo);letter-spacing:var(--tracking);}
  p{margin:0;}
  button,input,textarea{font-family:inherit;font-size:inherit;}
  button{cursor:pointer;}
  a{color:inherit;}

  /* Foco visible: sin esto la página no se puede navegar por teclado, y
     es una de las reglas que el validador exige antes de entregar. */
  :focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:2px;}
  .saltar{position:absolute;left:-9999px;background:var(--ink);color:#fff;
    padding:10px 16px;z-index:50;}
  .saltar:focus{left:12px;top:12px;}

  .sysbar{background:#0C1322;color:#C9D2EA;font-family:monospace;font-size:12.5px;}
  .sysbar .in{max-width:1000px;margin:0 auto;padding:11px 20px;display:flex;
    gap:14px;align-items:center;flex-wrap:wrap;}
  .sysbar .tag{background:#1B2438;border:1px solid #2A3654;border-radius:6px;
    padding:3px 9px;color:#9BB0E0;}
  .sysbar b{color:#fff;}
  .toggle{display:flex;background:#1B2438;border:1px solid #2A3654;
    border-radius:8px;overflow:hidden;}
  .toggle button{background:transparent;border:0;color:#9BB0E0;
    font-family:monospace;font-size:12px;padding:6px 13px;}
  .toggle button.on{background:var(--brand);color:#fff;}

  .wrap{max-width:1000px;margin:0 auto;padding:0 24px;}

  /* ══════════════════════════════════════════════════════════════
     NAVEGACIÓN POR SECCIONES

     La cotización de la primera venta real decía, literalmente: "una sola
     página con navegación por secciones". No estaba. Una landing de siete
     secciones sin menú obliga a hacer scroll a ciegas, y se siente como un
     documento largo en vez de un sitio.

     Se queda pegada arriba al bajar, marca en qué sección estás, y en el
     teléfono se vuelve un menú desplegable.
     ══════════════════════════════════════════════════════════════ */
  html{scroll-behavior:smooth;}
  @media(prefers-reduced-motion:reduce){ html{scroll-behavior:auto;} }
  /* Sin esto, el ancla deja el título debajo de la barra pegada. */
  .seccion,.hero{scroll-margin-top:78px;}

  .barra{position:sticky;top:0;z-index:30;background:var(--bg);
    border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s;}
  .barra.pegada{border-bottom-color:var(--line);
    box-shadow:0 6px 20px -14px rgba(0,0,0,.35);}
  [data-portada="oscura"] .barra{background:var(--brand);}
  [data-portada="oscura"] .barra.pegada{border-bottom-color:rgba(255,255,255,.16);}

  /* ---- CABECERA ---- */
  .top{display:flex;align-items:center;gap:14px;padding:18px 0;}

  .nav{margin-left:auto;display:flex;gap:4px;align-items:center;flex-wrap:wrap;}
  .nav a{font-size:13.5px;font-weight:500;color:var(--ink-soft);
    text-decoration:none;padding:8px 11px;border-radius:var(--boton-radio);
    white-space:nowrap;transition:color .15s,background .15s;}
  .nav a:hover{color:var(--ink);background:var(--surface);}
  /* La sección en la que estás, marcada con el segundo color de marca. */
  .nav a.activo{color:var(--ink);}
  .nav a.activo::after{content:"";display:block;height:2px;margin-top:5px;
    background:var(--accent);}
  [data-portada="oscura"] .nav a{color:rgba(255,255,255,.72);}
  [data-portada="oscura"] .nav a:hover{color:#fff;background:rgba(255,255,255,.08);}
  [data-portada="oscura"] .nav a.activo{color:#fff;}
  [data-dir="mercado"] .nav a{text-transform:uppercase;font-size:12.5px;
    letter-spacing:.04em;font-weight:600;}

  /* El botón de menú solo existe en pantallas angostas. */
  .menu-btn{display:none;margin-left:auto;width:42px;height:42px;border:0;
    background:transparent;padding:9px;flex-direction:column;
    justify-content:space-between;}
  .menu-btn span{display:block;height:2px;background:var(--ink);
    border-radius:2px;transition:transform .2s,opacity .2s;}
  [data-portada="oscura"] .menu-btn span{background:#fff;}
  .menu-btn[aria-expanded="true"] span:nth-child(1){transform:translateY(8px) rotate(45deg);}
  .menu-btn[aria-expanded="true"] span:nth-child(2){opacity:0;}
  .menu-btn[aria-expanded="true"] span:nth-child(3){transform:translateY(-8px) rotate(-45deg);}

  @media(max-width:820px){
    .menu-btn{display:flex;}
    .nav{position:absolute;left:0;right:0;top:100%;flex-direction:column;
      align-items:stretch;gap:0;background:var(--bg);padding:8px 24px 18px;
      border-bottom:1px solid var(--line);
      /* Cerrado no ocupa espacio ni recibe el foco por teclado. */
      display:none;}
    .nav.abierto{display:flex;}
    [data-portada="oscura"] .nav{background:var(--brand);
      border-bottom-color:rgba(255,255,255,.16);}
    .nav a{padding:13px 2px;border-radius:0;font-size:15px;}
    .nav a + a{border-top:1px solid var(--line);}
    [data-portada="oscura"] .nav a + a{border-top-color:rgba(255,255,255,.12);}
    .nav a.activo::after{display:none;}
    .nav a.activo{color:var(--accent);}
  }
  .logo{width:44px;height:44px;border-radius:12px;background:var(--brand);
    color:#fff;display:grid;place-items:center;font-family:var(--display);
    font-weight:700;font-size:21px;flex:none;}
  .logo.conimg{background:none;overflow:hidden;}
  .logo img{width:100%;height:100%;object-fit:contain;display:block;}
  .top .nombre{font-family:var(--display);font-weight:600;font-size:17px;}
  .banner{display:block;width:100%;max-height:260px;object-fit:cover;
    border-radius:14px;margin:22px 0 0;background:var(--line);}
  .banner[hidden]{display:none;}

  /* ---- HERO ----
     No centrado. El texto alineado a la izquierda se lee mejor y deja
     que el titular ocupe el ancho que quiera sin parecer un cartel. */
  .hero{padding:calc(56px * var(--ritmo)) 0 calc(40px * var(--ritmo));}

  /* ══════════════════════════════════════════════════════════════
     PORTADA OSCURA — `pagina.hero.fondo: "oscuro"`

     Es la cuarta manera de abrir, y salió de mirar referencias reales:
     Atomix (dos estrellas Michelin) no pone una página blanca con texto
     encima — pone la FOTOGRAFÍA como suelo y el texto flotando en ella.
     La paleta la pone la imagen.

     Sirve para las identidades que son oscuras de nacimiento: una empresa
     de ingeniería o construcción cuyo material corporativo es azul marino
     con fotografía grande se ve ajena en un fondo casi blanco, aunque el
     contraste pase.

     No es una dirección de arte nueva: es una opción del hero que se
     combina con las tres. Con foto queda la imagen; sin foto, el color de
     marca a sangre — que sigue siendo mejor que un hueco gris.
     ══════════════════════════════════════════════════════════════ */
  /* La cabecera se suma a la portada oscura: una sola pieza, sin costura. */
  [data-portada="oscura"] .top{background:var(--brand);color:#fff;
    margin:0 calc(50% - 50vw);padding:22px calc(50vw - 50%) 0;}
  [data-portada="oscura"] .top .logo{background:#fff;color:var(--brand);}
  [data-portada="oscura"] .top .logo.conimg{background:rgba(255,255,255,.96);}

  .hero.oscuro{
    background:var(--brand);color:#fff;
    /* Se sale del .wrap para ocupar todo el ancho de la ventana. */
    margin:0 calc(50% - 50vw);padding-left:calc(50vw - 50%);
    padding-right:calc(50vw - 50%);
    padding-top:calc(76px * var(--ritmo));padding-bottom:calc(68px * var(--ritmo));
    position:relative;isolation:isolate;overflow:hidden;}
  .hero.oscuro .hero-foto{position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;z-index:-2;}

  /* SIN FOTO, una retícula de plano en vez de un rectángulo de color plano.
     No finge una fotografía: es textura de marca, hecha con dos degradados
     repetidos. Cuando llega la foto del cliente, queda debajo y no se ve.
     Existe porque un hero de 500 px de color liso con el texto en la mitad
     izquierda se lee como una sección sin terminar. */
  .hero.oscuro:not(:has(.hero-foto))::after{
    content:"";position:absolute;inset:0;z-index:-3;opacity:.5;
    background-image:
      repeating-linear-gradient(to right,
        color-mix(in srgb, #fff 9%, transparent) 0 1px, transparent 1px 76px),
      repeating-linear-gradient(to bottom,
        color-mix(in srgb, #fff 9%, transparent) 0 1px, transparent 1px 76px);}
  /* `:has` no está en todos los navegadores viejos; sin él la retícula
     simplemente no se pinta y queda el color plano, que es el estado de antes. */
  @supports not selector(:has(*)){
    .hero.oscuro::after{content:none;}
  }
  /* El velo: sin él, un titular blanco sobre una foto clara no se lee.
     Es más oscuro abajo, donde vive el texto. */
  .hero.oscuro::before{content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(100deg,
      color-mix(in srgb, var(--brand) 92%, transparent) 0%,
      color-mix(in srgb, var(--brand) 62%, transparent) 68%,
      color-mix(in srgb, var(--brand) 34%, transparent) 100%);}
  .hero.oscuro .lead{color:rgba(255,255,255,.82);}
  .hero.oscuro .eyebrow{color:var(--accent);}
  .hero.oscuro .cta{background:var(--accent);color:var(--ink);}
  [data-dir="boutique"] .hero.oscuro .cta{background:#fff;color:var(--ink);}
  [data-dir="mercado"] .hero.oscuro .cta{box-shadow:4px 4px 0 rgba(0,0,0,.45);}
  /* Navegadores sin color-mix: el velo cae a un negro translúcido. Se ve
     distinto, pero el texto se lee — que es lo que no es negociable. */
  @supports not (background: color-mix(in srgb, red 50%, transparent)){
    .hero.oscuro::before{background:linear-gradient(100deg,
      rgba(0,0,0,.72) 0%, rgba(0,0,0,.45) 70%, rgba(0,0,0,.25) 100%);}
  }
  .eyebrow{font-family:var(--eyebrow-familia);font-size:12px;
    text-transform:var(--eyebrow-mayus);letter-spacing:.09em;
    color:var(--accent);margin-bottom:18px;display:block;}
  .hero h1{font-size:clamp(34px,7vw,68px);max-width:var(--hero-ancho);}
  .hero .lead{margin-top:20px;max-width:52ch;font-size:clamp(16px,2vw,19px);
    color:var(--ink-soft);line-height:1.55;}
  .cta{display:inline-block;margin-top:30px;background:var(--brand);color:#fff;
    font-weight:600;font-size:15px;padding:14px 26px;border-radius:var(--boton-radio);
    text-decoration:none;text-transform:var(--boton-mayus);letter-spacing:.02em;
    transition:transform .14s ease,box-shadow .14s ease,opacity .14s ease;}
  .cta:hover{opacity:.92;transform:translateY(-1px);}

  .sprite{position:absolute;}

  /* ---- ICONOS DE LÍNEA ----
     Heredan el color de la sección: navy sobre claro, blanco sobre oscuro.
     El círculo es el mismo recurso gráfico del brochure corporativo. */
  .ic{width:22px;height:22px;flex:none;}
  .ic-caja{width:46px;height:46px;border-radius:50%;flex:none;
    display:grid;place-items:center;background:var(--brand);color:#fff;
    margin-bottom:14px;}
  .ic-caja .ic{width:23px;height:23px;}
  [data-dir="mercado"] .ic-caja{border-radius:4px;}
  [data-dir="boutique"] .ic-caja{background:transparent;color:var(--brand);
    border:1px solid var(--line);}

  /* ---- SECCIONES ---- */
  .seccion{padding:calc(44px * var(--ritmo)) 0;
    border-top:var(--borde) solid var(--line);}

  /* ══════════════════════════════════════════════════════════════
     BLOQUES DE COLOR Y DIAGONALES

     El brochure de un cliente corporativo no es una hoja blanca con texto:
     alterna bloques de color, y las transiciones son diagonales o curvas.
     Esa alternancia es la que da ritmo a la página; sin ella, siete
     secciones seguidas sobre el mismo fondo se leen como un documento.

     Qué secciones van oscuras lo dice la ficha:
       pagina.secciones_oscuras: [diferencial, galeria]
     ══════════════════════════════════════════════════════════════ */
  .seccion.oscura{
    background:var(--brand);color:#fff;border-top:0;
    /* Se sale del .wrap para ocupar todo el ancho de la ventana. */
    margin:0 calc(50% - 50vw);
    padding-left:calc(50vw - 50%);padding-right:calc(50vw - 50%);
    padding-top:calc(66px * var(--ritmo));padding-bottom:calc(60px * var(--ritmo));
    /* La diagonal: el recurso gráfico del brochure, en CSS y sin imágenes. */
    clip-path:polygon(0 0, 100% 34px, 100% 100%, 0 calc(100% - 34px));
    margin-top:calc(-34px + 0px);margin-bottom:-20px;}
  .seccion.oscura + .seccion{border-top:0;}
  .seccion.oscura > h2{color:#fff;}
  .seccion.oscura .dif-i{border-top-color:var(--accent);}
  .seccion.oscura .dif-i p,
  .seccion.oscura .paso p,
  .seccion.oscura .prosa{color:rgba(255,255,255,.78);}
  .seccion.oscura .ic-caja{background:var(--accent);color:var(--brand);}
  .seccion.oscura .paso-n{background:var(--accent);color:var(--brand);}
  .seccion.oscura .sect li{background:transparent;border-color:rgba(255,255,255,.3);
    color:rgba(255,255,255,.88);}
  .seccion.oscura .enlace{color:var(--accent);}
  [data-dir="boutique"] .seccion.oscura .ic-caja{border-color:rgba(255,255,255,.35);
    background:transparent;color:var(--accent);}
  /* En móvil la diagonal se achica: a 375 px, 34 px de sesgo se come el texto. */
  @media(max-width:600px){
    .seccion.oscura{clip-path:polygon(0 0, 100% 16px, 100% 100%, 0 calc(100% - 16px));
      margin-top:-16px;}
  }
  /* El título de sección con una regla corta debajo. Es el patrón que usan
     los brochures corporativos y le da al segundo color de marca un trabajo
     concreto en vez de dejarlo decorando. */
  .seccion > h2{font-size:clamp(22px,3.4vw,30px);margin-bottom:26px;
    max-width:24ch;padding-bottom:12px;position:relative;}
  .seccion > h2::after{content:"";position:absolute;left:0;bottom:0;
    width:52px;height:3px;background:var(--accent);}
  .seccion[hidden]{display:none;}

  /* Servicios: lista, no tarjetas con emoji. El emoji como icono es de las
     marcas más claras de plantilla generada, y no dice nada del negocio. */
  .servicios{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:calc(26px * var(--ritmo)) 30px;}
  .servicio h3{font-size:18px;margin-bottom:8px;}
  .servicio p{color:var(--ink-soft);font-size:14.5px;line-height:1.6;}

  /* ---- DIFERENCIAL ---- conjunto, no secuencia: sin numerar */
  .dif{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));
    gap:calc(26px * var(--ritmo)) 30px;}
  .dif-i{border-top:2px solid var(--accent);padding-top:14px;}
  .dif-i h3{font-size:16px;margin-bottom:7px;display:flex;align-items:center;gap:9px;}
  .dif-i p{color:var(--ink-soft);font-size:14.5px;line-height:1.6;}

  /* ---- PROCESO ---- secuencia real: los números son información */
  .pasos{list-style:none;margin:0;padding:0;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));
    gap:calc(24px * var(--ritmo)) 22px;counter-reset:none;}
  /* La LÍNEA que une los pasos. Es lo que convierte ocho círculos numerados
     en un proceso: sin ella son ocho cosas sueltas que además ya venían
     numeradas. Se dibuja desde cada círculo hacia el siguiente, y el último
     no la lleva. */
  .paso{position:relative;padding-top:38px;}
  .paso::before{content:"";position:absolute;left:34px;top:14px;right:-22px;
    height:2px;background:var(--line);}
  .paso:last-child::before{display:none;}
  .seccion.oscura .paso::before{background:rgba(255,255,255,.22);}
  /* En una sola columna la línea horizontal no tiene sentido. */
  @media(max-width:600px){ .paso::before{display:none;} }
  .paso-n{position:absolute;top:0;left:0;font-family:var(--mono);font-size:12px;
    font-weight:600;letter-spacing:.06em;color:#fff;background:var(--brand);
    width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    font-variant-numeric:tabular-nums;}
  .paso h3{font-size:14.5px;text-transform:uppercase;letter-spacing:.05em;
    margin-bottom:6px;}
  .paso p{color:var(--ink-soft);font-size:13.5px;line-height:1.55;}

  /* ---- GALERÍA ---- la foto es el contenido; el marco se quita del medio */
  /* Tres columnas, no cuatro. Dos razones: con 6 fotos (lo que se pide al
     cliente) cuatro columnas dejan dos huecos en la última fila, y una obra
     se muestra mejor grande que pequeña. Se le piden 6, 9 o 12 para que las
     filas siempre queden completas. */
  .gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));
    gap:14px;}
  .gal-i{position:relative;padding:0;border:0;background:var(--line);
    border-radius:var(--radius);overflow:hidden;cursor:zoom-in;display:block;}
  .gal-i img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;
    transition:transform .3s ease;}
  .gal-i:hover img{transform:scale(1.04);}
  .gal-p{position:absolute;left:0;right:0;bottom:0;padding:20px 12px 10px;
    font-size:12.5px;color:#fff;text-align:left;
    background:linear-gradient(transparent,rgba(0,0,0,.72));}

  .lupa{border:0;padding:0;background:transparent;max-width:min(94vw,1100px);}
  .lupa::backdrop{background:rgba(0,0,0,.88);}
  .lupa img{display:block;max-width:100%;max-height:82vh;object-fit:contain;
    border-radius:var(--radius);}
  .lupa-pie{color:#fff;font-size:13.5px;margin-top:10px;text-align:center;}
  .lupa-x{position:absolute;top:8px;right:10px;width:38px;height:38px;border:0;
    border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:24px;
    line-height:1;cursor:pointer;}

  /* ---- BOTÓN FLOTANTE DE WHATSAPP ----
     Verde de WhatsApp a propósito: es un color que la gente reconoce y no
     debe tematizarse con la marca del cliente, o deja de leerse como
     "escríbeme por WhatsApp". */
  .wa{position:fixed;right:20px;bottom:20px;z-index:40;background:#25D366;
    color:#fff;border-radius:30px;padding:13px 19px;font-weight:600;
    font-size:14.5px;text-decoration:none;display:flex;align-items:center;
    gap:9px;box-shadow:0 10px 28px -10px rgba(37,211,102,.75);
    transition:transform .14s ease;}
  .wa:hover{transform:translateY(-2px);}
  .wa svg{width:20px;height:20px;flex:none;}
  .wa[hidden]{display:none;}
  /* En un teléfono estorba el texto: queda el círculo con el icono. */
  @media(max-width:560px){
    .wa{padding:14px;border-radius:50%;right:16px;bottom:16px;}
    .wa .wa-t{display:none;}
  }

  /* ---- SECTORES ---- etiquetas, no tarjetas: es una lista de ámbitos */
  .sect{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px;}
  .sect li{border:1px solid var(--line);border-radius:var(--boton-radio);
    display:flex;align-items:center;gap:8px;
    padding:9px 16px;font-size:14px;color:var(--ink-soft);background:var(--surface);}

  .prosa{max-width:62ch;font-size:16px;line-height:1.7;color:var(--ink);}
  .lista{list-style:none;margin:0;padding:0;font-size:15px;line-height:2;}
  .dosc{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:calc(26px * var(--ritmo)) 30px;}
  .rotulo{font-family:var(--mono);font-size:11.5px;text-transform:uppercase;
    letter-spacing:.09em;color:var(--ink-soft);margin-bottom:10px;}
  .enlace{display:inline-block;margin-top:10px;color:var(--brand);
    font-size:14px;font-weight:600;text-decoration:none;
    border-bottom:1px solid currentColor;}
  .enlace:hover{opacity:.75;}

  /* ---- FORMULARIO ---- */
  form{max-width:480px;display:flex;flex-direction:column;gap:12px;}
  .campo label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
  input,textarea{width:100%;padding:12px 14px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--surface);color:var(--ink);
    transition:border-color .14s;}
  input:hover,textarea:hover{border-color:var(--ink-soft);}
  textarea{resize:vertical;min-height:96px;}
  form button{background:var(--brand);color:#fff;font-weight:600;border:0;
    border-radius:var(--boton-radio);padding:14px;margin-top:4px;
    text-transform:var(--boton-mayus);letter-spacing:.02em;transition:opacity .14s;}
  form button:hover{opacity:.92;}
  .msg{min-height:20px;font-size:14px;color:var(--brand);}
  .msg.mal{color:var(--danger);}

  footer{border-top:var(--borde) solid var(--line);padding:26px 0 60px;
    display:flex;flex-wrap:wrap;gap:18px 30px;align-items:flex-start;
    justify-content:space-between;font-size:13.5px;color:var(--ink-soft);}
  footer b{font-family:var(--display);font-size:16px;color:var(--ink);display:block;}
  .pie-sub{display:block;margin-top:4px;font-size:12.5px;}
  .pie-datos{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;}
  .pie-datos .enlace{margin-top:0;display:inline-flex;align-items:center;gap:7px;}

  /* PIE OSCURO — el remate del brochure corporativo. Sin él la página
     termina con el formulario flotando en blanco: se siente cortada, no
     terminada. Se enciende con `secciones_oscuras: [pie]`. */
  footer.oscuro{background:var(--brand);color:rgba(255,255,255,.8);border-top:0;
    margin:40px calc(50% - 50vw) 0;
    padding:44px calc(50vw - 50%) 40px;
    clip-path:polygon(0 26px, 100% 0, 100% 100%, 0 100%);}
  footer.oscuro b{color:#fff;}
  footer.oscuro .enlace{color:var(--accent);}
  @media(max-width:600px){
    footer.oscuro{clip-path:polygon(0 14px, 100% 0, 100% 100%, 0 100%);}
  }

  @media(max-width:600px){
    .wrap{padding:0 18px;}
    .hero{padding:34px 0 26px;}
  }
  /* Quien pidió menos movimiento no debería recibir más. */
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
    .cta:hover{transform:none;}
  }
</style>
</head>

  apis: {
    mensajeria:"whatsapp", whatsapp_num:"573001234567",
    // El ID de medición de GA4. NO es un secreto: viaja en el HTML de

/* ---- SEGURIDAD (ver 03-componentes-ui/seguridad.js) ----
   Todo dato que no escribas tú pasa por esc() antes de tocar innerHTML.
   Esta base lo tenía sin escapar: el titular, los servicios y el pie se
   interpolaban directo, y ese contenido sale del brief del cliente. */
function esc(v){
  if(v===null||v===undefined) return "";
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
/* Solo http(s) y rutas del propio sitio: bloquea javascript: y data:. */
function urlSegura(v){
  const s=String(v||"").trim();
  if(!s) return "";
  if(/^https?:\/\//i.test(s) || s.startsWith("/") || s.startsWith("./")) return s;
  return "";
}
function esEmailValido(v){const s=String(v||"").trim();return s.length<=254&&/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s);}
function esTelefonoValido(v){return /^\d{7,15}$/.test(String(v||"").replace(/[\s()+-]/g,""));}
function limpiarTexto(v,max=500){
  return String(v??"").replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g,"").trim().slice(0,max);
}

/* ---- LOGO Y BANNER ----
   Aguantan que el elemento no exista: borrar un id del marcado y que el
   script muera con él ya dejó una entrega en blanco. */
function pintarLogo(el, m, cliente){
  if(!el) return;
  const src = urlSegura(m && m.logo);
  el.textContent = "";
  if(src){
    const img = document.createElement("img");
    img.src = src; img.alt = cliente || ""; img.decoding = "async";
    el.appendChild(img);
    el.classList.add("conimg");
  } else {
    el.classList.remove("conimg");
    el.textContent = (m && m.inicial) || "";
  }
}
function pintarBanner(el, m, cliente){
  if(!el) return;
  const src = urlSegura(m && m.banner);
  if(!src){ el.hidden = true; el.removeAttribute("src"); return; }
  el.src = src; el.alt = cliente || "";
  el.loading = "lazy"; el.decoding = "async";
  el.hidden = false;
}

   2) SECCIONES — cada una se pinta SOLO si trae contenido.
      Una sección vacía no se rellena: se omite. El hueco dice la
      verdad sobre lo que falta pedirle al cliente.
   ════════════════════════════════════════════════════════════ */
function pintarHero(){
  const el = document.getElementById("hero");
  if(!el) return;
  const h = (CONTEXT.pagina && CONTEXT.pagina.hero) || {};
  const t = String(h.titular||"").trim();
  const b = String(h.bajada||"").trim();
  if(!t && !b){ el.hidden = true; return; }
  const eyebrow = String(h.eyebrow||"").trim();
  const cta = String(h.cta||"").trim();

  // PORTADA OSCURA. `hero.fondo: "oscuro"` abre con el color de marca a
  // sangre, y con la foto encima si la hay. Es para las identidades que son
  // oscuras de nacimiento: una constructora cuyo brochure es azul marino se
  // ve ajena en un fondo casi blanco, aunque el contraste pase.
  const oscuro = String(h.fondo||"").trim().toLowerCase() === "oscuro";
  const foto = urlSegura(h.foto);

  // Con portada oscura, la CABECERA también va oscura. Si no, queda una
  // franja blanca de 70 px con el logo encima del hero oscuro y se lee como
  // un error de maquetación, no como una decisión.
  document.documentElement.setAttribute("data-portada", oscuro ? "oscura" : "clara");

  el.className = "hero" + (oscuro ? " oscuro" : "");
  el.innerHTML =
      (oscuro && foto
        ? '<img class="hero-foto" src="'+esc(foto)+'" alt="" '
          + 'decoding="async" fetchpriority="high">' : '')
    + (eyebrow ? '<span class="eyebrow">'+esc(eyebrow)+'</span>' : '')
    + (t ? '<h1>'+esc(t)+'</h1>' : '')
    + (b ? '<p class="lead">'+esc(b)+'</p>' : '')
    + (cta ? '<a class="cta" href="#leads">'+esc(cta)+'</a>' : '');
  el.hidden = false;
}

  'engranaje','lista','escudo','idea','mano','grafica','red','tienda','edificio',
  'arbol','fabrica','llave','puente','lupa','reloj'];

function icono(nombre, conCaja){

  if(!ICONOS.includes(n)) return "";

  return conCaja ? '<span class="ic-caja">'+svg+'</span>' : svg;

function pintarGaleria(){

  if(!el) return;
  const p = CONTEXT.pagina || {};

    .map((f)=>({ src: urlSegura(typeof f === "string" ? f : f && f.src),
                 pie: String((f && f.pie) || "").trim() }))

  fondoDe(el, "galeria");

        + (f.pie ? '<span class="gal-p">'+esc(f.pie)+'</span>' : '')
        + '</button>').join('')
    + '</div>';
  el.hidden = false;

  // La ampliación. Si el navegador no trae <dialog>, el clic simplemente

  const lupa = document.getElementById("lupa");
  const img = document.getElementById("lupaImg");

}

/* GOOGLE ANALYTICS 4.
   El ID de medición NO es un secreto: viaja en el HTML de cualquier sitio
   que use GA4, así que vive en la ficha y no en el .env. Si no hay ID, no
   se carga nada — ni una petición de red. */
function cargarAnalitica(){
  const id = String((CONTEXT.apis && CONTEXT.apis.ga4_id) || "").trim();
  if(!/^G-[A-Z0-9]{4,}$/i.test(id)) return;

  const s = document.createElement("script");
  s.async = true;
  s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(id);
  document.head.appendChild(s);

  window.dataLayer = window.dataLayer || [];
  function gtag(){ window.dataLayer.push(arguments); }
  window.gtag = gtag;
  gtag("js", new Date());
  gtag("config", id);
}

/* ════════════════════════════════════════════════════════════
   LA NAVEGACIÓN.

   Se arma DESPUÉS de pintar las secciones, con las que de verdad quedaron
   visibles: si el cliente no mandó fotos, "Proyectos" no aparece en el
   menú. Un enlace que salta a una sección oculta deja al visitante mirando
   el vacío y parece que la página está rota.

   El nombre de cada enlace sale del <h2> de la sección, no de una lista
   aparte: así no hay dos sitios que digan cómo se llama lo mismo.
   ════════════════════════════════════════════════════════════ */
const SECCIONES_NAV = [
  { id: 'servicios',   corto: 'Servicios' },
  { id: 'diferencial', corto: 'Diferencial' },
  { id: 'proceso',     corto: 'Proceso' },
  { id: 'galeria',     corto: 'Proyectos' },
  { id: 'sectores',    corto: 'Sectores' },
  { id: 'sobre',       corto: 'Nosotros' },
  { id: 'leads',       corto: 'Contacto' },
];

function pintarNav(){
  const nav = document.getElementById("nav");
  if(!nav) return;

  const visibles = SECCIONES_NAV.filter((s) => {
    const el = document.getElementById(s.id);
    return el && !el.hidden;
  });

  // Con una o dos secciones un menú no ayuda: estorba.
  if(visibles.length < 3){
    nav.innerHTML = "";
    const b = document.getElementById("menuBtn");
    if(b) b.hidden = true;
    return;
  }

  // Un menú son ETIQUETAS, no títulos. Se usa el nombre corto siempre:
  // "Nuestro proceso" y "Por qué INCOARQI" en la barra la vuelven un
  // párrafo, y además el ancho del menú cambia con cada cliente.
  nav.innerHTML = visibles
    .map((s) => '<a href="#'+s.id+'" data-sec="'+s.id+'">'+esc(s.corto)+'</a>')
    .join('');

  cablearNav(visibles.map((s) => s.id));
}

function cablearNav(ids){
  const nav = document.getElementById("nav");
  const btn = document.getElementById("menuBtn");
  const barra = document.getElementById("barra");

  const cerrar = () => {
    if(!nav || !btn) return;
    nav.classList.remove("abierto");
    btn.setAttribute("aria-expanded", "false");
    btn.setAttribute("aria-label", "Abrir el menú");
  };

  if(btn && nav){
    btn.onclick = () => {
      const abierto = nav.classList.toggle("abierto");
      btn.setAttribute("aria-expanded", String(abierto));
      btn.setAttribute("aria-label", abierto ? "Cerrar el menú" : "Abrir el menú");
    };
    // Al elegir una sección el menú se cierra: en un teléfono, si no, tapa
    // justo lo que la persona acaba de pedir ver.
    nav.querySelectorAll("a").forEach((a) => { a.onclick = cerrar; });
    document.addEventListener("keydown", (e) => { if(e.key === "Escape") cerrar(); });
  }

  // La barra se marca cuando deja de estar en su sitio.
  if(barra && typeof IntersectionObserver === "function"){
    const centinela = document.createElement("div");
    centinela.style.cssText = "position:absolute;top:0;height:1px;width:1px";
    document.body.prepend(centinela);
    new IntersectionObserver(([e]) => {
      barra.classList.toggle("pegada", !e.isIntersecting);
    }).observe(centinela);
  }

  // En qué sección estás. Sin librerías: IntersectionObserver con el
  // margen corrido para que la sección "activa" sea la del tercio superior.
  if(typeof IntersectionObserver !== "function") return;
  const marcar = (id) => {
    if(!nav) return;
    nav.querySelectorAll("a").forEach((a) =>
      a.classList.toggle("activo", a.dataset.sec === id));
  };
  const visor = new IntersectionObserver((entradas) => {
    const dentro = entradas.filter((e) => e.isIntersecting)
      .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
    if(dentro.length) marcar(dentro[0].target.id);
  }, { rootMargin: "-72px 0px -62% 0px", threshold: 0 });

  ids.forEach((id) => {
    const el = document.getElementById(id);
    if(el) visor.observe(el);
  });
}

/** Las tres direcciones válidas. Cualquier otra cosa cae en "taller". */
const DIRECCIONES = ['mercado', 'boutique', 'taller'];

function applyTheme(){
  const m = CONTEXT.marca || {}, r = document.documentElement.style;
  if(m.primario) r.setProperty('--brand', m.primario);
  if(m.secundario) r.setProperty('--bg', m.secundario);
  // Vacío a propósito = sin segundo color, y la página queda monocromática.
  if(m.acento) r.setProperty('--accent', m.acento);
  // La tipografía la manda la DIRECCIÓN. Esto es un estilo en línea y le
  // gana a [data-dir], así que solo se aplica si el cliente trae la suya.
  if(m.display) r.setProperty('--display', m.display);
  if(m.body) r.setProperty('--body', m.body);

  document.documentElement.setAttribute('data-dir',
    DIRECCIONES.includes(m.direccion) ? m.direccion : 'taller');

  pintarLogo(document.getElementById('logo'), m, CONTEXT.cliente);
  pintarBanner(document.getElementById('banner'), m, CONTEXT.cliente);
  document.getElementById('biz').textContent = CONTEXT.cliente;
  document.getElementById('sysClient').textContent = CONTEXT.cliente;
  document.getElementById('sysDB').textContent = CONTEXT.base_de_datos.motor;

  pintarHero(); pintarServicios(); pintarDiferencial(); pintarProceso();
  pintarGaleria(); pintarSectores(); pintarSobre(); pintarDatos();
  pintarLeads(); pintarWhatsApp(); pintarPie();
  // El menú va al final: necesita saber qué secciones quedaron visibles.
  pintarNav();
}

    nombre: limpiarTexto(form.nombre.value, 80),
    contacto: limpiarTexto(form.contacto.value, 120),
    mensaje: limpiarTexto(form.mensaje.value, 500),
  };
  msg.classList.remove('mal');
  if (!lead.nombre) {
    msg.textContent = 'Falta tu nombre.'; msg.classList.add('mal');
    form.nombre.focus(); return;
  }
  if (!esEmailValido(lead.contacto) && !esTelefonoValido(lead.contacto)) {
    msg.textContent = 'Escribe un WhatsApp o un correo con el que podamos responderte.';
    msg.classList.add('mal'); form.contacto.focus(); return;
  }
  await db.save(lead);
  medirLead();
  msg.textContent = 'Recibido. Te escribimos pronto.';
  form.reset();
  if (CONTEXT.apis.mensajeria === 'whatsapp' && CONTEXT.apis.whatsapp_num) {
    const texto = 'Hola, soy ' + lead.nombre + '. '
      + (lead.mensaje || 'Quiero más información.');
    window.open('https://wa.me/' + CONTEXT.apis.whatsapp_num
      + '?text=' + encodeURIComponent(texto), '_blank', 'noopener');
  }
});

applyTheme();
cargarAnalitica();

/* @demo-only
   Conmutador de la sysbar: enseña en vivo la diferencia entre las tres
   direcciones. Los marcadores de arriba y abajo se los lleva
   crear-proyecto.js: al cliente no le llega esta función. */
(function cablearDirecciones(){
  const sw = document.querySelector('.dirsw');
  if(!sw) return;
  const marcar = (d) => sw.querySelectorAll('button').forEach((b) =>
    b.classList.toggle('on', b.dataset.d === d));
  sw.querySelectorAll('button').forEach((b) => {
    b.onclick = () => { CONTEXT.marca.direccion = b.dataset.d; applyTheme(); marcar(b.dataset.d); };
  });
  marcar(document.documentElement.getAttribute('data-dir'));
})();
/* @fin-demo */
</script>
